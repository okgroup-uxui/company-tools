  :root{
    --black:#f2f1ed;
    --panel:#ffffff;
    --panel-2:#eceae5;
    --line-dark:#dedad2;
    --paper:#ffffff;
    --ink:#111111;
    --muted:#726f68;
    --muted-2:#a6a29a;
    --line:#e4e4e4;
    --line-strong:#111111;
    --white:#161512;
    --accent:#FF571F;
    --accent-dark:#d6440f;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Pretendard', sans-serif;}

  .app{
    max-width:1180px;
    margin:0 auto;
    padding:36px 24px 80px;
  }

  /* ===== Masthead ===== */
  .masthead{
    border-bottom:1px solid var(--line-dark);
    padding-bottom:20px;
    margin-bottom:24px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
  }
  .masthead-left .eyebrow{
    font-size:11px;
    letter-spacing:0.22em;
    color:var(--muted);
    margin-bottom:8px;
  }
  .masthead-left h1{
    font-family:'OK Font Light', 'Pretendard', sans-serif;
    font-weight:300;
    font-size:34px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .masthead-right{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .week-nav{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--line-dark);
    border-radius:999px;
    padding:6px 8px 6px 16px;
    background:var(--panel);
  }
  .week-nav .range{
    font-size:13px;
    color:var(--white);
    min-width:150px;
    text-align:center;
  }
  .week-nav button{
    width:34px;height:34px;
    border-radius:50%;
    border:2px solid var(--line-dark);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    font-size:16px;
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .week-nav button:hover{background:var(--panel-2); border-color:var(--ink);}
  .save-state{
    font-size:11px;
    color:var(--muted);
    min-width:64px;
  }

  /* ===== Team tabs ===== */
  .team-tabs{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
    border-bottom:1px solid var(--line-dark);
  }
  .team-tabs .tabs-left{display:flex;}
  .tabs-right{display:flex; align-items:center; gap:4px;}
  .team-tab{
    background:transparent;
    border:none;
    color:var(--muted);
    font-size:15px;
    font-weight:700;
    padding:13px 22px;
    cursor:pointer;
    position:relative;
    font-family:inherit;
    border-radius:6px 6px 0 0;
  }
  .team-tab:hover{background:var(--panel-2);}
  .team-tab .n{
    font-family:'Pretendard', sans-serif;
    font-size:11px;
    margin-right:6px;
    color:var(--muted-2);
  }
  .team-tab.active{color:var(--ink);}
  .team-tab.active::after{
    content:'';
    position:absolute;
    left:0;right:0;bottom:-1px;
    height:3px;
    background:var(--white);
  }
  .export-all{
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    background:transparent;
    border:2px solid var(--accent);
    border-radius:8px;
    cursor:pointer;
    padding:9px 16px;
  }
  .export-all:hover{background:var(--accent); color:#ffffff;}

  /* ===== Layout: editor + paper preview ===== */
  .board{
    display:grid;
    grid-template-columns:1.15fr 1fr;
    gap:28px;
    align-items:start;
  }
  @media (max-width: 880px){
    .board{grid-template-columns:1fr;}
  }

  .editor{
    background:var(--panel);
    border:1px solid var(--line-dark);
    border-radius:4px;
    padding:24px;
  }
  .block{margin-bottom:26px;}
  .block:last-child{margin-bottom:0;}
  .block-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .block-head .label{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .block-head .label .num{
    font-family:'Pretendard', sans-serif;
    color:var(--muted-2);
    margin-right:6px;
    font-weight:400;
  }
  .line-item{
    display:grid;
    grid-template-columns:16px 88px 1fr 142px 28px;
    align-items:center;
    gap:6px;
    margin-bottom:4px;
  }
  .line-item .dash{color:var(--muted); font-size:14px;}
  .line-item input{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line-dark);
    color:var(--white);
    font-size:13px;
    padding:6px 2px;
    font-family:inherit;
    width:100%;
    min-width:0;
  }
  .line-item input.cat{
    color:var(--muted);
    font-size:12px;
  }
  .line-item input.due{
    color:var(--muted);
    font-size:12px;
    font-family:'Pretendard', sans-serif;
  }
  .line-item input.due::-webkit-calendar-picker-indicator{
    cursor:pointer;
  }
  .line-item input.due:disabled{
    opacity:0.35;
  }
  .due-group{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
  }
  .due-group .due{flex:1; min-width:0;}
  .ongoing-label{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:12px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
    cursor:pointer;
    flex:0 0 auto;
  }
  .ongoing-label input[type=checkbox]{
    width:16px; height:16px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .line-item input:focus{
    outline:none;
    border-bottom:1px solid var(--white);
    color:var(--white);
  }
  .line-item .del{
    width:26px; height:26px;
    background:transparent;
    border:2px solid var(--line-dark);
    border-radius:50%;
    color:var(--muted);
    cursor:pointer;
    font-size:14px;
    font-weight:800;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .line-item .del:hover{background:var(--danger); border-color:var(--danger); color:#ffffff;}
  .line-detail{
    margin:0 0 12px 20px;
  }
  .line-detail textarea{
    width:100%;
    min-height:44px;
    background:transparent;
    border:1px dashed var(--line-dark);
    border-radius:3px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
    padding:6px 8px;
    font-family:inherit;
    resize:vertical;
  }
  .line-detail textarea:focus{
    outline:none;
    color:var(--white);
    border-color:var(--white);
  }
  .vacation-row{
    grid-template-columns:16px 1fr 1fr 28px;
  }
  .col-labels{
    display:grid;
    grid-template-columns:16px 88px 1fr 142px 28px;
    gap:6px;
    margin-bottom:6px;
  }
  .col-labels.vacation-cols{
    grid-template-columns:16px 1fr 1fr 28px;
  }
  .col-labels span{
    font-size:11px;
    font-weight:700;
    color:var(--muted);
    letter-spacing:0.03em;
  }
  .add-line{
    background:none;
    border:2px dashed var(--muted-2);
    color:var(--ink);
    font-size:13px;
    font-weight:700;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    font-family:inherit;
    margin-top:2px;
  }
  .add-line:hover{border-style:solid; border-color:var(--accent); color:var(--accent);}

  .editor-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:4px;
    padding-top:20px;
    border-top:1px solid var(--line-dark);
  }
  .actions-left, .actions-right{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .actions-right{margin-left:auto;}
  .btn{
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    border:2px solid var(--accent);
    background:var(--accent);
    color:#ffffff;
    transition:background-color .15s, color .15s;
  }
  .btn:hover{background:var(--accent-dark); border-color:var(--accent-dark);}
  .btn:disabled{opacity:0.4; cursor:default;}
  .btn.ghost{
    background:transparent;
    color:var(--accent);
    border:2px solid var(--accent);
  }
  .btn.ghost:hover{background:var(--accent); color:#ffffff;}
  .btn.dirty{
    box-shadow:0 0 0 4px rgba(255,87,31,0.25);
  }

  .status-line{
    font-size:12px;
    color:var(--muted);
    margin-top:10px;
    min-height:16px;
  }

  /* ===== Paper preview ===== */
  .paper-wrap{
    position:sticky;
    top:24px;
  }
  .paper{
    background:var(--paper);
    color:var(--ink);
    border-radius:2px;
    padding:40px 36px 36px;
    box-shadow:0 20px 45px -22px rgba(20,20,15,0.18);
  }
  .paper-head{
    text-align:center;
    border-bottom:3px double var(--line-strong);
    padding-bottom:16px;
    margin-bottom:18px;
  }
  .paper-head .dept{
    font-family:'Pretendard', sans-serif;
    font-size:10px;
    letter-spacing:0.2em;
    color:var(--muted-2);
    margin-bottom:6px;
  }
  .paper-head h2{
    font-family:'OK Font Light', 'Pretendard', sans-serif;
    font-weight:300;
    font-size:26px;
    margin:0 0 10px;
  }
  .paper-head .meta{
    display:flex;
    justify-content:center;
    gap:18px;
    font-size:11px;
    color:var(--muted-2);
    font-family:'Pretendard', sans-serif;
  }
  .paper-summary{
    font-size:13px;
    line-height:1.7;
    color:var(--ink);
    background:#f6f6f6;
    border-left:2px solid var(--ink);
    padding:10px 14px;
    margin-bottom:20px;
    font-style:italic;
  }
  .paper-sub{
    font-size:11px;
    font-weight:700;
    color:var(--muted-2);
    margin:16px 0 6px;
    letter-spacing:0.03em;
  }
  .paper-sub:first-of-type{margin-top:0;}
  .paper-row{
    margin-bottom:5px;
    padding-bottom:5px;
    border-bottom:1px dotted #ddd;
  }
  .paper-row:last-child{border-bottom:none;}
  .paper-row .row-main{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:13px;
    line-height:1.6;
  }
  .paper-row .tag{
    flex:0 0 auto;
    font-size:10px;
    font-family:'Pretendard', sans-serif;
    color:#fff;
    background:var(--ink);
    padding:2px 6px;
    border-radius:2px;
    white-space:nowrap;
  }
  .paper-row .txt{flex:1;}
  .paper-row .due{
    flex:0 0 auto;
    font-size:11px;
    font-family:'Pretendard', sans-serif;
    color:var(--muted-2);
    white-space:nowrap;
  }
  .paper-row .detail-txt{
    font-size:12px;
    color:var(--muted-2);
    line-height:1.5;
    margin-top:3px;
    padding-left:2px;
    white-space:pre-wrap;
  }
  .paper-vacation{
    font-size:13px;
    line-height:1.6;
    color:var(--ink);
  }
  .paper-empty{
    color:#bbb;
    font-size:12px;
    font-style:italic;
  }

  .preview-actions{
    display:flex;
    justify-content:flex-end;
    flex-wrap:wrap;
    gap:8px;
    margin-top:16px;
  }
  .preview-actions .btn{
    flex:0 0 auto;
    height:40px;
    padding:0 20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:#ffffff;
    color:var(--ink);
    border:2px solid var(--line-dark);
    text-align:center;
  }
  .preview-actions .btn:hover{background:var(--panel-2); border-color:var(--accent); color:var(--accent);}

  .print-container{display:none;}
  @media print{
    body > *{display:none !important;}
    .print-container{display:block !important;}
    .print-container .paper{
      box-shadow:none;
      page-break-after:always;
      break-after:page;
    }
    .print-container .paper:last-child{
      page-break-after:auto;
      break-after:auto;
    }
    .paper-trend-img{max-height:480px; object-fit:contain;}
    .trend-images{max-height:480px;}
    .trend-images img{object-fit:contain;}
  }

  /* ===== Presentation mode (landscape / TV) ===== */
  .present{
    display:none;
    position:fixed;
    inset:0;
    background:var(--black);
    flex-direction:column;
    padding:28px 40px 20px;
    z-index:1000;
  }
  .present-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .present-index{
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.08em;
  }
  .present-range{
    font-size:13px;
    color:var(--muted);
  }
  .present-controls{display:flex; gap:8px;}
  .present-btn{
    font-family:'Pretendard', sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    background:transparent;
    border:2px solid var(--accent);
    border-radius:8px;
    padding:9px 16px;
    cursor:pointer;
  }
  .present-btn:hover{background:var(--accent); color:#ffffff;}
  .present-btn:disabled{opacity:0.4; cursor:default;}

  .present-stage{
    flex:1;
    min-height:0;
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    padding:36px 48px;
    display:flex;
    flex-direction:column;
    box-shadow:0 24px 60px -26px rgba(20,20,15,0.22);
  }
  .p-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:3px double var(--line-strong);
    padding-bottom:16px;
    margin-bottom:18px;
    flex:0 0 auto;
  }
  .p-head .p-dept{
    font-family:'Pretendard', sans-serif;
    font-size:13px;
    letter-spacing:0.18em;
    color:var(--muted-2);
    margin-bottom:8px;
  }
  .p-head h2{
    font-family:'OK Font Light', 'Pretendard', sans-serif;
    font-weight:300;
    font-size:32px;
    margin:0;
  }
  .p-head .p-meta{
    font-family:'Pretendard', sans-serif;
    font-size:15px;
    color:var(--muted-2);
  }
  .p-summary{
    font-size:18px;
    line-height:1.6;
    color:var(--ink);
    background:#f6f6f6;
    border-left:3px solid var(--ink);
    padding:12px 18px;
    margin-bottom:22px;
    font-style:italic;
    flex:0 0 auto;
  }
  .p-cols{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:32px;
  }
  .p-cols-work{
    grid-template-columns:2fr 0.7fr 2fr;
  }
  .p-col{
    min-width:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .p-col-narrow{align-items:center;}
  .p-col-narrow .p-col-title{width:100%; text-align:center;}
  .p-col-narrow .p-col-body{width:100%;}
  .p-col-body{
    flex:1;
    min-height:0;
  }
  .p-col-title{
    font-size:16px;
    font-weight:800;
    letter-spacing:0.01em;
    padding-bottom:10px;
    margin-bottom:14px;
    border-bottom:2px solid var(--line-strong);
    flex:0 0 auto;
  }
  .p-row{
    margin-bottom:14px;
    padding-bottom:12px;
    border-bottom:1px dotted #ddd;
  }
  .p-row:last-child{border-bottom:none;}
  .p-row-date{
    text-align:center;
  }
  .p-due-main{
    display:block;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
  }
  .p-row .p-tag{
    display:inline-block;
    font-size:11px;
    font-family:'Pretendard', sans-serif;
    color:#fff;
    background:var(--ink);
    padding:2px 8px;
    border-radius:2px;
    margin-bottom:6px;
  }
  .p-row .p-txt{
    font-size:19px;
    line-height:1.45;
    display:block;
  }
  .p-row .p-due{
    display:block;
    font-size:13px;
    font-family:'Pretendard', sans-serif;
    color:var(--muted-2);
    margin-top:4px;
  }
  .p-row .p-detail{
    display:block;
    font-size:14px;
    line-height:1.5;
    color:var(--muted-2);
    margin-top:4px;
    white-space:pre-wrap;
  }
  .p-vacation{
    flex:0 0 auto;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line-strong);
    font-size:14px;
    color:var(--muted-2);
  }
  .p-vacation b{color:var(--ink); font-weight:800; margin-right:8px;}
  .p-empty{
    color:#bbb;
    font-size:16px;
    font-style:italic;
  }

  .present-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    padding-top:16px;
    flex:0 0 auto;
  }
  .present-arrow{
    width:48px;height:48px;
    border-radius:50%;
    border:2px solid var(--accent);
    background:transparent;
    color:var(--accent);
    font-size:22px;
    font-weight:800;
    cursor:pointer;
  }
  .present-arrow:hover{background:var(--accent); color:#ffffff;}
  .present-dots{display:flex; gap:10px;}
  .present-dot{
    width:10px;height:10px;
    border-radius:50%;
    background:var(--line-dark);
    cursor:pointer;
    border:none;
    padding:0;
  }
  .present-dot.active{background:var(--accent);}

  /* ===== Report type tabs ===== */
  .type-tabs{
    display:inline-flex;
    gap:4px;
    margin-bottom:16px;
    background:var(--panel-2);
    border-radius:10px;
    padding:4px;
  }
  .type-tab{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    padding:10px 20px;
    border-radius:7px;
    border:none;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
  }
  .type-tab.active{
    background:var(--panel);
    color:var(--ink);
    box-shadow:0 1px 4px rgba(20,20,15,0.15);
  }

  /* ===== Trend report form ===== */
  .trend-people-bar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:24px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line-dark);
  }
  .trend-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    background:var(--panel-2);
    border:2px solid transparent;
    border-radius:999px;
    padding:8px 14px;
    cursor:pointer;
  }
  .trend-chip.active{
    background:var(--panel);
    border-color:var(--accent);
    color:var(--accent);
  }
  .trend-chip:hover{border-color:var(--accent);}
  .trend-chip-del{
    color:var(--muted-2);
    font-weight:800;
    padding:0 2px;
  }
  .trend-chip-del:hover{color:var(--danger);}
  .trend-chip-add{
    background:transparent;
    border:2px dashed var(--muted-2);
    color:var(--ink);
  }
  .trend-chip-add:hover{border-style:solid; border-color:var(--accent); color:var(--accent);}
  .trend-chip.has-content:not(.active)::after{
    content:'●';
    font-size:8px;
    color:var(--accent);
    margin-left:2px;
    vertical-align:middle;
  }
  .trend-current-author{
    font-size:13px;
    color:var(--muted);
    margin:-10px 0 20px;
  }
  .trend-current-author b{color:var(--ink); font-weight:800;}
  .trend-field{margin-bottom:22px;}
  .trend-field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
  }
  .trend-field .num{
    font-family:'Pretendard', sans-serif;
    color:var(--muted-2);
    margin-right:6px;
    font-weight:400;
  }
  .trend-field input[type=text]{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line-dark);
    color:var(--white);
    font-size:15px;
    padding:8px 2px;
    font-family:inherit;
  }
  .trend-field input[type=text]:focus{outline:none; border-bottom:1px solid var(--white);}
  .trend-field textarea{
    width:100%;
    min-height:140px;
    background:var(--panel-2);
    border:1px solid var(--line-dark);
    border-radius:4px;
    color:var(--white);
    font-size:14px;
    line-height:1.6;
    padding:12px;
    font-family:inherit;
    resize:vertical;
  }
  .trend-field textarea:focus{outline:none; border-color:var(--white);}

  .rte-toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    padding:6px;
    background:var(--panel-2);
    border:1px solid var(--line-dark);
    border-radius:6px 6px 0 0;
    border-bottom:none;
  }
  .rte-btn{
    width:34px; height:34px;
    border-radius:5px;
    border:2px solid var(--line-dark);
    background:var(--panel);
    color:var(--ink);
    cursor:pointer;
    font-size:15px;
  }
  .rte-btn.rte-bold{font-weight:900;}
  .rte-btn:hover{border-color:var(--accent); color:var(--accent);}
  .rte-swatch{
    width:24px; height:24px;
    border-radius:50%;
    border:2px solid var(--panel);
    box-shadow:0 0 0 1px var(--line-dark);
    cursor:pointer;
    padding:0;
  }
  .rte-swatch:hover{box-shadow:0 0 0 2px var(--accent);}
  .rte-color-picker{
    width:34px; height:34px;
    border-radius:5px;
    border:2px solid var(--line-dark);
    padding:2px;
    cursor:pointer;
    background:var(--panel);
  }
  .content-editable{
    width:100%;
    min-height:160px;
    background:var(--panel-2);
    border:1px solid var(--line-dark);
    border-radius:0 0 6px 6px;
    color:var(--white);
    font-size:14px;
    line-height:1.6;
    padding:12px;
    font-family:inherit;
    overflow-y:auto;
  }
  .content-editable:focus{outline:none; border-color:var(--accent);}
  .content-editable:empty:before{
    content:attr(data-placeholder);
    color:var(--muted);
  }
  .image-drop{
    border:1px dashed var(--line-dark);
    border-radius:4px;
    padding:16px;
    text-align:center;
    cursor:pointer;
    color:var(--muted);
    font-size:12px;
    position:relative;
    overflow:hidden;
  }
  .image-drop:hover{border-color:var(--white); color:var(--white);}
  .image-drop img{
    max-width:100%;
    max-height:220px;
    display:block;
    margin:0 auto 10px;
    border-radius:2px;
  }
  .image-drop input[type=file]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }
  .image-remove{
    display:inline-block;
    margin-top:8px;
    font-size:11px;
    color:var(--muted-2);
    text-decoration:underline;
    cursor:pointer;
    position:relative;
    z-index:2;
  }
  .image-remove:hover{color:var(--white);}

  .img-layout-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
  }
  .img-layout-label{
    font-size:12px;
    color:var(--muted);
    font-weight:700;
    margin-right:4px;
  }
  .img-layout-btn{
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    padding:8px 14px;
    border-radius:6px;
    border:2px solid var(--line-dark);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }

  .img-add-tile{
    position:relative;
    aspect-ratio:1;
    border:2px dashed var(--muted-2);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:12px;
    font-weight:700;

  .img-add-tile:hover{border-color:var(--accent); color:var(--accent);}
  .img-add-tile input[type=file]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;

  /* ===== Trend paper preview ===== */
  .paper-trend-author{
    font-family:'Pretendard', sans-serif;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--muted-2);
    margin-bottom:8px;
  }
  .paper-trend-title{
    font-family:'OK Font Light', 'Pretendard', sans-serif;
    font-weight:300;
    font-size:20px;
    margin:0 0 14px;
  }
  .paper-trend-img{
    width:100%;
    border-radius:3px;
    margin-bottom:14px;
    display:block;
  }
  .trend-images{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .trend-images.layout-column{flex-direction:column;}
  .trend-images.layout-row{flex-direction:row;}
  .trend-images img{
    flex:1;
    min-width:0;
    min-height:0;
    width:100%;
    border-radius:3px;
    object-fit:cover;
  }
  .trend-images.layout-row img{max-height:220px;}
  .trend-images.layout-column img{max-height:200px;}
  .paper-trend-content{
    font-size:13px;
    line-height:1.7;
    white-space:pre-wrap;
  }
  .paper-trend-split{
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .paper-trend-split-img{flex:0 0 42%; min-width:0;}
  .paper-trend-split-img .paper-trend-img,
  .paper-trend-split-img .trend-images{margin-bottom:0;}
  .paper-trend-split-content{flex:1; min-width:0;}

  /* ===== Order panel ===== */
  .order-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    z-index:900;
    align-items:center;
    justify-content:center;
  }
  .order-panel{
    background:var(--panel);
    border:1px solid var(--line-dark);
    border-radius:6px;
    padding:24px;
    width:420px;
    max-width:90vw;
  }
  .order-panel h3{
    font-size:15px;
    margin:0 0 4px;
    font-weight:700;
  }
  .order-panel .sub{
    font-size:12px;
    color:var(--muted);
    margin-bottom:16px;
  }
  .order-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border:1px solid var(--line-dark);
    border-radius:4px;
    margin-bottom:8px;
    background:var(--panel-2);
  }
  .order-row .order-num{
    font-family:'Pretendard', sans-serif;
    font-size:13px;
    color:var(--muted-2);
    width:20px;
  }
  .order-row .order-label{flex:1; font-size:14px;}
  .order-row .order-btns{display:flex; gap:6px;}
  .order-row .order-btns button{
    width:32px;height:32px;
    border-radius:6px;
    border:2px solid var(--accent);
    background:transparent;
    color:var(--accent);
    cursor:pointer;
    font-size:14px;
    font-weight:800;

  .order-row .order-btns button:hover{background:var(--accent); color:#ffffff;}
  .order-row .order-btns button:disabled{opacity:0.25; cursor:default; background:transparent; color:var(--accent);}
  .order-empty{font-size:12px; color:var(--muted); font-style:italic;}
  .order-close{
    width:100%;
    margin-top:14px;
  }
</style>
</head>

<script>

// ===== Backend config =====
// 배포한 Cloudflare Worker 주소를 넣어주세요 (예: "https://weekly-report-storage.yourname.workers.dev")
const API_BASE_URL = "https://report.okgroup0425.workers.dev";
// worker.js에서 API_KEY 시크릿을 설정했다면 여기에 같은 값을 넣어주세요. 안 썼다면 빈 문자열로 두세요.
const API_KEY = "28b1debcab5c9cd03429fff56532c5b7";

const TEAMS = [
  {key:'marketing', label:'마케팅팀'},
  {key:'design', label:'디자인팀'},
  {key:'uxui', label:'UX/UI팀'}
];
const BLOCKS = [
  {key:'done', label:'이번주 업무', paperLabel:'이번주 업무'},
  {key:'issue', label:'비고', paperLabel:'비고'}
];
const REPORT_TYPES = [
  {key:'work', label:'업무보고'},
  {key:'trend', label:'트렌드보고'}
];
// 트렌드보고 작성자 고정 명단
const ROSTER = {
  marketing: ['배동환', '박진호', '김유정'],
  design: ['공주원', '이진명'],
  uxui: ['박상준', '조연주', '한지희', '신수림']
};

let activeReportType = 'work';
let activeTeam = 'marketing';
let currentMonday = getMonday(new Date());

// state[teamKey] = { done:[item], issue:[item], polished:{done:null,...}, summary:null }
// item = { text:'', category:'', due:'', detail:'' }
let state = {};
TEAMS.forEach(t => state[t.key] = emptyTeamState());

// trendState[teamKey] = array of entries, one per roster member: [{ id, author, title, image, content }]
// id는 작성자 이름을 그대로 사용 (팀 내 명단은 고정이라 이름이 곧 안정적인 식별자)
let trendState = {};
TEAMS.forEach(t => trendState[t.key] = emptyTrendState(t.key));

// 트렌드 편집 화면에서 팀별로 지금 편집 중인 항목(사람)의 id
let activeTrendEntryId = {};

// slideOrder: array of ids controlling presentation order.
// work slides: "work:{team}" / trend slides: "trend:{team}:{authorName}"
let slideOrder = [];
TEAMS.forEach(t => { slideOrder.push(`work:${t.key}`); });

function emptyItem(){ return { text:'', detail:'', category:'', due:'' }; }
function emptyVacationItem(){ return { name:'', period:'' }; }
function emptyTeamState(){
  return {
    done:[emptyItem()], issue:[emptyItem()],
    vacation:[emptyVacationItem()],
    polished:{done:null, issue:null}, summary:null
  };
}
function generateId(){
  return 't' + Math.random().toString(36).slice(2, 9);
}
function emptyTrendEntry(author){
  return { id: author, author, title:'', images:[], imageLayout:'row', slideLayout:'row', content:'' };
}
function normalizeTrendEntry(entry){
  // 예전 데이터(image 단일 문자열)를 images 배열로 이전
  if(!Array.isArray(entry.images)){
    entry.images = entry.image ? [entry.image] : [];
  }
  if(entry.imageLayout !== 'row' && entry.imageLayout !== 'column'){
    entry.imageLayout = 'row';
  }
  if(entry.slideLayout !== 'row' && entry.slideLayout !== 'column'){
    entry.slideLayout = 'row';
  }
  delete entry.image;
  return entry;
}
function emptyTrendState(teamKey){
  return (ROSTER[teamKey] || []).map(name => emptyTrendEntry(name));
}
// 현재 trendState[teamKey]를 ROSTER 명단과 맞춘다: 명단에 있는 사람은 항목 유지(내용 보존),
// 없는 사람은 새로 만들고, 명단에 없는 이전 항목은 제거한다.
function syncTrendRoster(teamKey){
  const roster = ROSTER[teamKey] || [];
  const existing = trendState[teamKey] || [];
  trendState[teamKey] = roster.map(name => {
    const found = existing.find(e => e.author === name);
    return found ? normalizeTrendEntry({ ...found, id: name, author: name }) : emptyTrendEntry(name);
  });
}

function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  date.setDate(diff);
  date.setHours(0,0,0,0);
  return date;
}
function fmt(d){
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDue(due){
  if(!due) return '';
  if(due === 'ongoing') return '계속';
  const [y,m,d] = due.split('-');
  return `~${Number(m)}/${Number(d)}`;
}
function weekKey(monday){
  return `${monday.getFullYear()}-w${String(getWeekNum(monday)).padStart(2,'0')}`;
}
function getWeekNum(d){
  const target = new Date(d);
  const dayNr = (target.getDay()+6)%7;
  target.setDate(target.getDate()-dayNr+3);
  const firstThursday = new Date(target.getFullYear(),0,4);
  const diff = target - firstThursday;
  return 1 + Math.round(diff/(7*24*3600*1000));
}
// 월요일에 보고하는 건 "다음 주" 업무를 미리 정리하는 것이므로,
// 화면에 표시하는 주차 라벨은 현재 선택된 주(currentMonday) 기준이 아니라
// 그 다음 주의 금요일이 속한 달/주차로 계산한다. (예: 8/24주 작성 -> "9월 1주차" 표시)
function nextWeekLabel(monday){
  const nextMonday = new Date(monday);
  nextMonday.setDate(nextMonday.getDate()+7);
  const nextFriday = new Date(nextMonday);
  nextFriday.setDate(nextFriday.getDate()+4);
  const month = nextFriday.getMonth()+1;
  const weekNum = Math.ceil(nextFriday.getDate()/7);
  return `${month}월 ${weekNum}주차`;
}

function renderWeekRange(){
  document.getElementById('weekRange').textContent = nextWeekLabel(currentMonday);
}

function renderTypeTabs(){
  const wrap = document.getElementById('typeTabs');
  wrap.innerHTML = '';
  REPORT_TYPES.forEach(rt => {
    const btn = document.createElement('button');
    btn.className = 'type-tab' + (activeReportType === rt.key ? ' active' : '');
    btn.textContent = rt.label;
    btn.onclick = () => { activeReportType = rt.key; renderAll(); };
    wrap.appendChild(btn);
  });
}

function renderTabs(){
  const wrap = document.getElementById('teamTabs');
  wrap.innerHTML = '';
  TEAMS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'team-tab' + (activeTeam === t.key ? ' active' : '');
    btn.innerHTML = `<span class="n mono">0${i+1}</span>${t.label}`;
    btn.onclick = () => { activeTeam = t.key; renderAll(); };
    wrap.appendChild(btn);
  });
}

function renderEditor(){
  if(activeReportType === 'work') renderWorkEditor();
  else renderTrendEditor();
}

function renderWorkEditor(){
  const wrap = document.getElementById('editor');
  wrap.innerHTML = '';
  const s = state[activeTeam];

  BLOCKS.forEach((b, bi) => {
    const block = document.createElement('div');
    block.className = 'block';

    const head = document.createElement('div');
    head.className = 'block-head';
    head.innerHTML = `<div class="label"><span class="num mono">0${bi+1}</span>${b.label}</div>`;
    block.appendChild(head);

    const colLabels = document.createElement('div');
    colLabels.className = 'col-labels';
    colLabels.innerHTML = `<span></span><span>카테고리</span><span>업무 제목</span><span>완료예정일</span><span></span>`;
    block.appendChild(colLabels);

    s[b.key].forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'line-item';
      row.innerHTML = `<span class="dash">–</span>`;

      const catInput = document.createElement('input');
      catInput.type = 'text';
      catInput.className = 'cat';
      catInput.value = item.category;
      catInput.placeholder = '분류 입력';
      catInput.oninput = (e) => { item.category = e.target.value; renderPaper(); markDirty(); };
      row.appendChild(catInput);

      const textInput = document.createElement('input');
      textInput.type = 'text';
      textInput.value = item.text;
      textInput.placeholder = idx === 0 ? placeholderFor(b.key) : '';
      textInput.oninput = (e) => { item.text = e.target.value; s.polished[b.key] = null; s.summary = null; renderPaper(); markDirty(); };
      row.appendChild(textInput);

      const dueGroup = document.createElement('div');
      dueGroup.className = 'due-group';

      const dueInput = document.createElement('input');
      dueInput.type = 'date';
      dueInput.className = 'due';
      dueInput.value = item.due === 'ongoing' ? '' : item.due;
      dueInput.disabled = item.due === 'ongoing';
      dueInput.oninput = (e) => { item.due = e.target.value; renderPaper(); markDirty(); };
      dueGroup.appendChild(dueInput);

      const ongoingLabel = document.createElement('label');
      ongoingLabel.className = 'ongoing-label';
      const ongoingCheckbox = document.createElement('input');
      ongoingCheckbox.type = 'checkbox';
      ongoingCheckbox.checked = item.due === 'ongoing';
      ongoingCheckbox.onchange = (e) => {
        if(e.target.checked){
          item.due = 'ongoing';
        } else {
          item.due = '';
        }
        renderEditor(); renderPaper(); markDirty();
      };
      ongoingLabel.appendChild(ongoingCheckbox);
      ongoingLabel.appendChild(document.createTextNode('계속'));
      dueGroup.appendChild(ongoingLabel);

      row.appendChild(dueGroup);

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.onclick = () => { s[b.key].splice(idx,1); if(s[b.key].length===0) s[b.key].push(emptyItem()); s.polished[b.key]=null; renderEditor(); renderPaper(); markDirty(); };
      row.appendChild(del);

      block.appendChild(row);

      const detailRow = document.createElement('div');
      detailRow.className = 'line-detail';
      const detailTextarea = document.createElement('textarea');
      detailTextarea.value = item.detail || '';
      detailTextarea.placeholder = '업무 상세내용 (선택)';
      detailTextarea.oninput = (e) => { item.detail = e.target.value; renderPaper(); markDirty(); };
      detailRow.appendChild(detailTextarea);
      block.appendChild(detailRow);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-line';
    addBtn.textContent = '+ 항목 추가';
    addBtn.onclick = () => { s[b.key].push(emptyItem()); renderEditor(); };
    block.appendChild(addBtn);

    wrap.appendChild(block);
  });

  // 이번 주 휴가자
  const vacBlock = document.createElement('div');
  vacBlock.className = 'block';
  const vacHead = document.createElement('div');
  vacHead.className = 'block-head';
  vacHead.innerHTML = `<div class="label"><span class="num mono">03</span>이번 주 휴가자</div>`;
  vacBlock.appendChild(vacHead);

  const vacColLabels = document.createElement('div');
  vacColLabels.className = 'col-labels vacation-cols';
  vacColLabels.innerHTML = `<span></span><span>이름</span><span>기간</span><span></span>`;
  vacBlock.appendChild(vacColLabels);

  s.vacation.forEach((v, idx) => {
    const row = document.createElement('div');
    row.className = 'line-item vacation-row';
    row.innerHTML = `<span class="dash">–</span>`;

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = v.name;
    nameInput.placeholder = '이름';
    nameInput.oninput = (e) => { v.name = e.target.value; renderPaper(); markDirty(); };
    row.appendChild(nameInput);

    const periodInput = document.createElement('input');
    periodInput.type = 'text';
    periodInput.value = v.period;
    periodInput.placeholder = '예: 8/25(월)~8/27(수)';
    periodInput.oninput = (e) => { v.period = e.target.value; renderPaper(); markDirty(); };
    row.appendChild(periodInput);

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.onclick = () => { s.vacation.splice(idx,1); if(s.vacation.length===0) s.vacation.push(emptyVacationItem()); renderEditor(); renderPaper(); markDirty(); };
    row.appendChild(del);

    vacBlock.appendChild(row);
  });

  const vacAddBtn = document.createElement('button');
  vacAddBtn.className = 'add-line';
  vacAddBtn.textContent = '+ 휴가자 추가';
  vacAddBtn.onclick = () => { s.vacation.push(emptyVacationItem()); renderEditor(); };
  vacBlock.appendChild(vacAddBtn);

  wrap.appendChild(vacBlock);

  const actions = document.createElement('div');
  actions.className = 'editor-actions';
  actions.innerHTML = `
    <div class="actions-left">
      <button class="btn" id="polishBtn">AI로 다듬기</button>
      <button class="btn ghost" id="clearBtn">이 팀 초기화</button>
    </div>
    <div class="actions-right">
      <button class="btn ghost" id="refreshBtn">↻ 새로고침</button>
      <button class="btn" id="saveBtn">💾 저장하기</button>
    </div>
  `;
  wrap.appendChild(actions);

  const status = document.createElement('div');
  status.className = 'status-line';
  status.id = 'statusLine';
  wrap.appendChild(status);

  document.getElementById('polishBtn').onclick = polishTeamAndSummarize;
  document.getElementById('clearBtn').onclick = () => {
    if(!confirm('이 팀의 업무보고 내용을 전부 지울까요? 되돌릴 수 없어요.')) return;
    state[activeTeam] = emptyTeamState();
    renderEditor(); renderPaper(); markDirty();
  };
}

function getActiveTrendEntry(){
  const entries = trendState[activeTeam];
  let id = activeTrendEntryId[activeTeam];
  let entry = entries.find(e => e.id === id);
  if(!entry){
    entry = entries[0];
    activeTrendEntryId[activeTeam] = entry.id;
  }
  return entry;
}

function renderTrendEditor(){
  const wrap = document.getElementById('editor');
  wrap.innerHTML = '';
  syncTrendRoster(activeTeam);
  const entries = trendState[activeTeam];
  const s = getActiveTrendEntry();

  // 사람별 항목 선택 탭 (고정 명단)
  const peopleBar = document.createElement('div');
  peopleBar.className = 'trend-people-bar';
  entries.forEach((entry) => {
    const chip = document.createElement('button');
    const hasContent = entry.title || (entry.images && entry.images.length) || (entry.content && htmlToPlainText(entry.content));
    chip.className = 'trend-chip' + (entry.id === s.id ? ' active' : '') + (hasContent ? ' has-content' : '');
    chip.textContent = entry.author;
    chip.onclick = () => { activeTrendEntryId[activeTeam] = entry.id; renderEditor(); renderPaper(); };
    peopleBar.appendChild(chip);
  });
  wrap.appendChild(peopleBar);

function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('image load failed'));
      img.onload = () => {
        const maxW = 1000;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function placeholderFor(blockKey){

}

function itemsOf(s, blockKey){
  return s[blockKey].filter(it => it.text.trim().length > 0);

async function callClaude(promptText){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      messages:[{role:'user', content: promptText}]
    })
  });
  const data = await res.json();
  const text = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return text.trim();
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildPaperHtmlForTeam(teamKey){
  const t = TEAMS.find(x=>x.key===teamKey);
  const s = state[teamKey];

  let html = `
    <div class="paper-head">
      <div class="dept">OK금융그룹 · AX마케팅부 · ${t.label}</div>
      <h2>${t.label} 주간업무 보고</h2>
      <div class="meta"><span>${nextWeekLabel(currentMonday)}</span></div>
    </div>
  `;

  if(s.summary){
    html += `<div class="paper-summary">${escapeHtml(s.summary)}</div>`;
  }

  let any = false;
  BLOCKS.forEach(b=>{
    const items = itemsOf(s, b.key);
    if(!items.length) return;
    any = true;
    const texts = s.polished[b.key] || items.map(it=>it.text);
    html += `<div class="paper-sub">${b.paperLabel}</div>`;
    items.forEach((it, i) => {
      const txt = texts[i] || it.text;
      html += `<div class="paper-row"><div class="row-main">`;
      if(it.category) html += `<span class="tag">${escapeHtml(it.category)}</span>`;
      html += `<span class="txt">${escapeHtml(txt)}</span>`;
      if(it.due) html += `<span class="due">${fmtDue(it.due)}</span>`;
      html += `</div>`;
      if(it.detail) html += `<div class="detail-txt">${escapeHtml(it.detail)}</div>`;
      html += `</div>`;
    });
  });

  const vac = (s.vacation || []).filter(v => v.name.trim().length > 0);
  if(vac.length){
    any = true;
    html += `<div class="paper-sub">이번 주 휴가자</div><div class="paper-vacation">`;
    html += vac.map(v => `${escapeHtml(v.name)}${v.period ? ` (${escapeHtml(v.period)})` : ''}`).join(', ');
    html += `</div>`;
  }

  if(!any){
    html += `<div class="paper-empty">작성된 내용이 없습니다.</div>`;
  }

  return html;
}

function buildTrendImagesHtml(entry, singleClass){
  const images = entry.images || [];
  if(images.length === 0) return '';
  if(images.length === 1){
    return `<img class="${singleClass}" src="${images[0]}" alt="">`;
  }
  const layoutClass = entry.imageLayout === 'column' ? 'layout-column' : 'layout-row';
  return `<div class="trend-images ${layoutClass}">` +
    images.map(src => `<img src="${src}" alt="">`).join('') +
    `</div>`;
}

function buildPaperHtmlForTrend(teamKey, entry){
  const t = TEAMS.find(x=>x.key===teamKey);
  const s = entry;

  let html = `
    <div class="paper-head">
      <div class="dept">OK금융그룹 · AX마케팅부 · ${t.label} · 트렌드보고</div>
      <h2>${s.title ? escapeHtml(s.title) : t.label + ' 트렌드보고'}</h2>
    </div>
  `;

  const hasImages = s.images && s.images.length > 0;
  if(!s.author && !s.title && !hasImages && !s.content){
    html += `<div class="paper-empty">작성된 내용이 없습니다.</div>`;
    return html;
  }

  if(s.author) html += `<div class="paper-trend-author">작성자 · ${escapeHtml(s.author)}</div>`;

  if(s.slideLayout === 'row' && hasImages && s.content){
    html += `<div class="paper-trend-split">`;
    html += `<div class="paper-trend-split-img">${buildTrendImagesHtml(s, 'paper-trend-img')}</div>`;
    html += `<div class="paper-trend-split-content"><div class="paper-trend-content">${s.content}</div></div>`;
    html += `</div>`;
  } else {
    html += buildTrendImagesHtml(s, 'paper-trend-img');
    if(s.content) html += `<div class="paper-trend-content">${s.content}</div>`;
  }

  return html;
}

function htmlToPlainText(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html.replace(/<div>/g, '\n<div>').replace(/<br\s*\/?>/g, '\n');
  return (tmp.textContent || tmp.innerText || '').trim();
}

function paperToPlainText(teamKey, entry){
  const t = TEAMS.find(x=>x.key===teamKey);

  if(activeReportType === 'trend'){
    const s = entry || getActiveTrendEntry();
    let lines = [];
    lines.push(`${t.label} 트렌드보고`);
    lines.push('='.repeat(36));
    if(s.author){ lines.push(''); lines.push(`작성자: ${s.author}`); }
    if(s.title){ lines.push(''); lines.push(`제목: ${s.title}`); }
    if(s.images && s.images.length){ lines.push(''); lines.push(`(이미지 ${s.images.length}장 첨부됨 — 다운로드 파일에는 텍스트만 포함됩니다)`); }
    if(s.content){ lines.push(''); lines.push(htmlToPlainText(s.content)); }
    return lines.join('\n');
  }

  const s = state[teamKey];
  let lines = [];
  lines.push(`${t.label} 주간업무 보고`);
  lines.push(nextWeekLabel(currentMonday));
  lines.push('='.repeat(36));
  if(s.summary){ lines.push(''); lines.push(`▶ ${s.summary}`); }

  BLOCKS.forEach(b=>{
    const items = itemsOf(s, b.key);
    if(!items.length) return;
    const texts = s.polished[b.key] || items.map(it=>it.text);
    lines.push('');
    lines.push(`■ ${b.paperLabel}`);
    items.forEach((it, i) => {
      const txt = texts[i] || it.text;
      const cat = it.category ? `[${it.category}] ` : '';
      const due = it.due ? ` (${it.due === 'ongoing' ? '계속 진행' : '완료예정 ' + fmtDue(it.due).replace('~','')})` : '';
      lines.push(`  · ${cat}${txt}${due}`);
      if(it.detail) lines.push(`      ${it.detail.replace(/\n/g, '\n      ')}`);
    });
  });

  const vac = (s.vacation || []).filter(v => v.name.trim().length > 0);
  if(vac.length){
    lines.push('');
    lines.push('■ 이번 주 휴가자');
    lines.push('  ' + vac.map(v => `${v.name}${v.period ? ` (${v.period})` : ''}`).join(', '));
  }
  return lines.join('\n');
}

function downloadText(filename, content){
  const blob = new Blob([content], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function printAllPapers(){
  if(activeReportType === 'work'){
    printPages(TEAMS.map(t => buildPaperHtmlForTeam(t.key)));
  } else {
    const pages = [];
    TEAMS.forEach(t => {
      trendState[t.key].forEach(entry => {
        const hasText = entry.content && htmlToPlainText(entry.content).length > 0;
        if(!entry.title && !(entry.images && entry.images.length) && !hasText) return;
        pages.push(buildPaperHtmlForTrend(t.key, entry));
      });
    });
    if(pages.length === 0){
      alert('작성된 트렌드보고가 없어요.');
      return;
    }
    printPages(pages);
  }
}

async function changeWeek(days){
  if(isDirty){
    await saveCurrentWeek();
  }
  const d = new Date(currentMonday);
  d.setDate(d.getDate()+days);
  currentMonday = getMonday(d);
  await loadWeek();
  isDirty = false;
  updateSaveIndicator();
  renderAll();
}

let isDirty = false;
function markDirty(){
  isDirty = true;
  updateSaveIndicator();
}
function updateSaveIndicator(status){
  const el = document.getElementById('saveState');
  const btn = document.getElementById('saveBtn');
  if(status === 'saving'){
    if(el) el.textContent = '저장 중...';
    return;
  }
  if(status === 'saved'){
    if(el) el.textContent = '✓ 저장 완료';
    if(btn) btn.classList.remove('dirty');
    return;
  }
  if(status === 'failed'){
    if(el) el.textContent = '⚠ 저장 실패 — 다시 눌러주세요';
    if(btn) btn.classList.add('dirty');
    return;
  }
  if(el) el.textContent = isDirty ? '저장 안 된 변경사항 있음' : '';
  if(btn){
    if(isDirty) btn.classList.add('dirty');
    else btn.classList.remove('dirty');
  }
}

let saveInFlight = null;
async function saveCurrentWeek(){
  if(!API_BASE_URL){
    const el = document.getElementById('saveState');
    if(el) el.textContent = '⚠ API 미설정';
    return false;
  }
  // 이전 저장 요청이 아직 진행 중이면 먼저 끝날 때까지 기다린다.
  // (이미지가 포함된 느린 요청이 나중에 도착해서 최신 내용을 덮어쓰는 경합을 막기 위함)
  if(saveInFlight){
    await saveInFlight.catch(()=>{});
  }
  const doFetch = (async () => {
    try{
      const payload = { state, trendState, slideOrder };
      const res = await fetch(`${API_BASE_URL}/?key=${encodeURIComponent('weeklyreport:'+weekKey(currentMonday))}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          ...(API_KEY ? {'X-API-Key': API_KEY} : {})
        },
        body: JSON.stringify(payload)
      });
      if(!res.ok){
        const text = await res.text().catch(()=>'');
        throw new Error(`save failed: ${res.status} ${text}`);
      }
      return true;
    }catch(err){
      console.error('save failed', err);
      return false;
    }
  })();
  saveInFlight = doFetch;
  const ok = await doFetch;
  if(saveInFlight === doFetch) saveInFlight = null;
  return ok;
}

async function handleSaveClick(){
  const btn = document.getElementById('saveBtn');
  if(btn) btn.disabled = true;
  updateSaveIndicator('saving');
  const ok = await saveCurrentWeek();
  if(ok) isDirty = false;
  updateSaveIndicator(ok ? 'saved' : 'failed');
  if(btn) btn.disabled = false;
}

async function loadWeek(){
  if(!API_BASE_URL){
    resetAll();
    const el = document.getElementById('saveState');
    if(el) el.textContent = '⚠ API 미설정';
    return;
  }
  try{
    const res = await fetch(`${API_BASE_URL}/?key=${encodeURIComponent('weeklyreport:'+weekKey(currentMonday))}`, {
      headers: { ...(API_KEY ? {'X-API-Key': API_KEY} : {}) }
    });
    if(!res.ok){
      const text = await res.text().catch(()=>'');
      throw new Error(`load failed: ${res.status} ${text}`);
    }
    const result = await res.json();
    if(result && result.value){
      const payload = JSON.parse(result.value);
      state = payload.state || {};
      trendState = payload.trendState || {};
      slideOrder = payload.slideOrder || [];
      TEAMS.forEach(t=>{
        if(!state[t.key]) state[t.key] = emptyTeamState();
        // 이전 버전 데이터 호환: vacation, detail 필드가 없으면 채워준다
        const ts = state[t.key];
        if(!ts.vacation || !ts.vacation.length) ts.vacation = [emptyVacationItem()];
        BLOCKS.forEach(b => {
          if(!ts[b.key]) ts[b.key] = [emptyItem()];
          ts[b.key].forEach(item => { if(item.detail === undefined) item.detail = ''; });
        });

        // 이전 버전 데이터 호환: 트렌드보고가 팀당 1개(객체)였던 구조를
        // 팀당 여러 명(배열) 구조로 변환한 뒤, 고정 명단(ROSTER)에 맞춘다
        const trend = trendState[t.key];
        if(!trend){
          trendState[t.key] = [];
        } else if(!Array.isArray(trend)){
          trendState[t.key] = [{ id: trend.author || generateId(), author: trend.author||'', title: trend.title||'', image: trend.image||'', content: trend.content||'' }];
        }
        syncTrendRoster(t.key);
      });
      reconcileSlideOrder();
    } else {
      resetAll();
    }
  }catch(err){
    console.error('load failed', err);
    resetAll();
  }
}

function resetAll(){
  state = {};
  trendState = {};
  TEAMS.forEach(t => { state[t.key] = emptyTeamState(); trendState[t.key] = emptyTrendState(t.key); });
  activeTrendEntryId = {};
  slideOrder = [];
  TEAMS.forEach(t => { slideOrder.push(`work:${t.key}`); });
  reconcileSlideOrder();
}

function renderAll(){
  renderWeekRange();
  renderTypeTabs();
  renderTabs();
  renderEditor();
  renderPaper();
}

// ===== Slide helpers (shared by order panel + presentation) =====
function parseSlideId(id){
  const parts = id.split(':');
  return { type: parts[0], team: parts[1], entryId: parts[2] };
}
function findTrendEntry(team, entryId){
  return (trendState[team] || []).find(e => e.id === entryId);
}
function slideHasContent(id){
  const { type, team, entryId } = parseSlideId(id);
  if(type === 'work'){
    const s = state[team];
    if(!s) return false;
    const hasVacation = (s.vacation || []).some(v => v.name.trim().length > 0);
    return hasVacation || BLOCKS.some(b => itemsOf(s, b.key).length > 0);
  } else {
    const s = findTrendEntry(team, entryId);
    if(!s) return false;
    const hasContent = s.content && htmlToPlainText(s.content).length > 0;
    return !!(s.title || (s.images && s.images.length) || hasContent);
  }
}
function slideLabel(id){
  const { type, team, entryId } = parseSlideId(id);
  const t = TEAMS.find(x=>x.key===team);
  if(type === 'work') return `${t.label} · 업무보고`;
  const entry = findTrendEntry(team, entryId);
  const author = entry ? entry.author : '';
  return `${t.label} · 트렌드보고${author ? ' (' + author + ')' : ''}`;
}
function activeSlideOrder(){
  return slideOrder.filter(slideHasContent);
}

// 현재 존재하는 모든 슬라이드 id 목록 (업무보고 3개 + 트렌드보고 항목 전체)
function allKnownSlideIds(){
  const ids = [];
  TEAMS.forEach(t => ids.push(`work:${t.key}`));
  TEAMS.forEach(t => {
    (trendState[t.key] || []).forEach(entry => ids.push(`trend:${t.key}:${entry.id}`));
  });
  return ids;
}
function reconcileSlideOrder(){
  const known = allKnownSlideIds();
  known.forEach(id => { if(!slideOrder.includes(id)) slideOrder.push(id); });
  slideOrder = slideOrder.filter(id => known.includes(id));
}


// ===== Order panel =====
function renderOrderPanel(){
  reconcileSlideOrder();
  const list = document.getElementById('orderList');
  list.innerHTML = '';
  const active = activeSlideOrder();
  if(active.length === 0){
    list.innerHTML = `<div class="order-empty">아직 작성된 보고서가 없어요.</div>`;
    return;
  }
  active.forEach((id, idx) => {
    const row = document.createElement('div');
    row.className = 'order-row';
    row.innerHTML = `<span class="order-num mono">0${idx+1}</span><span class="order-label">${slideLabel(id)}</span>`;
    const btns = document.createElement('div');
    btns.className = 'order-btns';
    const up = document.createElement('button');
    up.textContent = '▲';
    up.disabled = idx === 0;
    up.onclick = () => { moveSlide(id, -1); };
    const down = document.createElement('button');
    down.textContent = '▼';
    down.disabled = idx === active.length - 1;
    down.onclick = () => { moveSlide(id, 1); };
    btns.appendChild(up); btns.appendChild(down);
    row.appendChild(btns);
    list.appendChild(row);
  });
}
function moveSlide(id, dir){
  const from = slideOrder.indexOf(id);
  let to = from + dir;
  // skip over slides without content when moving, so the visible order matches
  while(to >= 0 && to < slideOrder.length && !slideHasContent(slideOrder[to])){
    to += dir;
  }
  if(to < 0 || to >= slideOrder.length) return;
  const tmp = slideOrder[from];
  slideOrder[from] = slideOrder[to];
  slideOrder[to] = tmp;
  renderOrderPanel();
  markDirty();
}

document.getElementById('orderBtn').addEventListener('click', () => {
  renderOrderPanel();

document.getElementById('orderCloseBtn').addEventListener('click', () => {

});

// ===== Presentation mode =====
let presentIndex = 0;
let presentDeck = [];

function buildPresentHtmlForWork(teamKey){
  const t = TEAMS.find(x=>x.key===teamKey);
  const s = state[teamKey];

  let html = `
    <div class="p-head">
      <div>
        <div class="p-dept">OK금융그룹 · AX마케팅부 · 업무보고</div>
        <h2>${t.label} 주간업무 보고</h2>
      </div>
      <div class="p-meta">${nextWeekLabel(currentMonday)}</div>
    </div>
  `;

  if(s.summary){
    html += `<div class="p-summary">${escapeHtml(s.summary)}</div>`;
  }

  html += `<div class="p-cols p-cols-work">`;

  const doneItems = itemsOf(s, 'done');
  const doneTexts = s.polished['done'] || doneItems.map(it=>it.text);
  const issueItems = itemsOf(s, 'issue');
  const issueTexts = s.polished['issue'] || issueItems.map(it=>it.text);

  // 컬럼 1: 이번주 업무 (넓게)
  html += `<div class="p-col p-col-wide"><div class="p-col-title">이번주 업무</div><div class="p-col-body">`;
  if(!doneItems.length){
    html += `<div class="p-empty">작성된 내용이 없습니다.</div>`;
  } else {
    doneItems.forEach((it, i) => {
      const txt = doneTexts[i] || it.text;
      html += `<div class="p-row">`;
      if(it.category) html += `<span class="p-tag">${escapeHtml(it.category)}</span>`;
      html += `<span class="p-txt">${escapeHtml(txt)}</span>`;
      if(it.detail) html += `<span class="p-detail">${escapeHtml(it.detail)}</span>`;
      html += `</div>`;
    });
  }
  html += `</div></div>`;

  // 컬럼 2: 진행날짜 / 완료예정일 (좁게) — 이번주 업무와 같은 순서로 매칭
  html += `<div class="p-col p-col-narrow"><div class="p-col-title">진행날짜</div><div class="p-col-body">`;
  if(!doneItems.length){
    html += `<div class="p-empty">-</div>`;
  } else {
    doneItems.forEach((it) => {
      const dueText = it.due ? (it.due === 'ongoing' ? '계속 진행' : fmtDue(it.due).replace('~','')) : '-';
      html += `<div class="p-row p-row-date"><span class="p-due-main">${escapeHtml(dueText)}</span></div>`;
    });
  }
  html += `</div></div>`;

  // 컬럼 3: 비고 (넓게)
  html += `<div class="p-col p-col-wide"><div class="p-col-title">비고</div><div class="p-col-body">`;
  if(!issueItems.length){
    html += `<div class="p-empty">작성된 내용이 없습니다.</div>`;
  } else {
    issueItems.forEach((it, i) => {
      const txt = issueTexts[i] || it.text;
      html += `<div class="p-row">`;
      if(it.category) html += `<span class="p-tag">${escapeHtml(it.category)}</span>`;
      html += `<span class="p-txt">${escapeHtml(txt)}</span>`;
      if(it.due) html += `<span class="p-due">${it.due === 'ongoing' ? '계속 진행' : '완료예정 ' + fmtDue(it.due).replace('~','')}</span>`;
      if(it.detail) html += `<span class="p-detail">${escapeHtml(it.detail)}</span>`;
      html += `</div>`;
    });
  }
  html += `</div></div>`;

  html += `</div>`;

  const vac = (s.vacation || []).filter(v => v.name.trim().length > 0);
  if(vac.length){
    html += `<div class="p-vacation"><b>이번 주 휴가자</b> ${vac.map(v => escapeHtml(v.name) + (v.period ? ` (${escapeHtml(v.period)})` : '')).join(', ')}</div>`;
  }

  return html;
}

function buildPresentHtmlForTrend(teamKey, entry){
  const t = TEAMS.find(x=>x.key===teamKey);
  const s = entry;
  const images = s.images || [];

  let html = `
    <div class="p-head">
      <div>
        <div class="p-dept">OK금융그룹 · AX마케팅부 · ${t.label} · 트렌드보고${s.author ? ' · ' + escapeHtml(s.author) : ''}</div>
        <h2>${s.title ? escapeHtml(s.title) : t.label + ' 트렌드보고'}</h2>
      </div>
    </div>
  `;

  if(!s.author && !s.title && images.length === 0 && !s.content){
    html += `<div class="p-empty" style="margin-top:20px;">작성된 내용이 없습니다.</div>`;
    return html;
  }

  const outerDir = s.slideLayout === 'column' ? 'column' : 'row';
  const imgBasis = outerDir === 'row' ? '46%' : '50%';
  html += `<div style="flex:1; min-height:0; display:flex; flex-direction:${outerDir}; gap:32px; align-items:stretch;">`;
  if(images.length === 1){
    html += `<div style="flex:0 0 ${imgBasis}; min-width:0; min-height:0; display:flex; align-items:center; justify-content:center;">
      <img src="${images[0]}" style="max-width:100%; max-height:100%; object-fit:contain; border-radius:4px;">
    </div>`;
  } else if(images.length > 1){
    const dir = s.imageLayout === 'column' ? 'column' : 'row';
    html += `<div style="flex:0 0 ${imgBasis}; display:flex; flex-direction:${dir}; gap:10px; min-width:0; min-height:0;">`;
    images.forEach(src => {
      html += `<img src="${src}" style="flex:1; min-width:0; min-height:0; width:100%; height:100%; object-fit:cover; border-radius:4px;">`;
    });
    html += `</div>`;
  }
  html += `<div style="flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; min-height:0; overflow:hidden;">`;
  if(s.content) html += `<div class="p-trend-body" style="font-size:18px; line-height:1.65;">${s.content}</div>`;
  html += `</div>`;
  html += `</div>`;

  return html;
}

function renderPresent(){
  const id = presentDeck[presentIndex];
  if(!id){
    document.getElementById('presentStage').innerHTML = `<div class="p-empty">발표할 보고서가 없어요.</div>`;
    document.getElementById('presentIndex').textContent = `00 / 00`;
    return;
  }
  const { type, team, entryId } = parseSlideId(id);
  if(type === 'work'){
    document.getElementById('presentStage').innerHTML = buildPresentHtmlForWork(team);
  } else {
    const entry = findTrendEntry(team, entryId);
    document.getElementById('presentStage').innerHTML = entry
      ? buildPresentHtmlForTrend(team, entry)
      : `<div class="p-empty">삭제된 항목이에요.</div>`;
  }
  document.getElementById('presentIndex').textContent = `0${presentIndex+1} / 0${presentDeck.length}`;
  document.getElementById('presentRange').textContent = nextWeekLabel(currentMonday);

  const dots = document.getElementById('presentDots');
  dots.innerHTML = '';
  presentDeck.forEach((slideId, i) => {
    const dot = document.createElement('button');
    dot.className = 'present-dot' + (i === presentIndex ? ' active' : '');
    dot.title = slideLabel(slideId);
    dot.onclick = () => { presentIndex = i; renderPresent(); };
    dots.appendChild(dot);
  });

  requestAnimationFrame(() => {
    fitPresentStage();
    // 이미지가 늦게 로드되면 실제 높이가 늘어나 글이 잘릴 수 있으므로,
    // 이미지 로드가 끝날 때마다 다시 계산한다.
    document.querySelectorAll('#presentStage img').forEach(img => {
      if(!img.complete){
        img.addEventListener('load', fitPresentStage, { once:true });
        img.addEventListener('error', fitPresentStage, { once:true });
      }
    });
  });
}

function fitBlock(box, body, minScale){
  if(!body) return;
  body.style.transform = 'none';
  body.style.width = '100%';
  const titleEl = box.querySelector('.p-col-title');
  const available = box.clientHeight - (titleEl ? titleEl.offsetHeight : 0) - 6;
  const needed = body.scrollHeight;
  if(available > 0 && needed > available){
    let scale = Math.max(minScale, Math.min(1, available / needed));
    body.style.transformOrigin = 'top left';
    body.style.width = (100/scale) + '%';
    body.style.transform = `scale(${scale})`;
  }
}

function fitPresentStage(){
  document.querySelectorAll('#presentStage .p-col').forEach(col => {
    fitBlock(col, col.querySelector('.p-col-body'), 0.55);
  });
  const trendWrap = document.querySelector('#presentStage .p-trend-body');
  if(trendWrap){
    const outer = trendWrap.parentElement;
    fitBlock(outer, trendWrap, 0.6);
  }
}

async function enterPresent(){
  // 저장 안 된 변경사항이 있으면 먼저 저장한 뒤, 서버 최신 데이터를 다시 불러온다
  // (다른 PC에서 방금 입력·저장한 내용도 놓치지 않게 함)
  document.getElementById('presentBtn').disabled = true;
  document.getElementById('presentBtn').textContent = '불러오는 중...';
  if(isDirty){
    await saveCurrentWeek();
    isDirty = false;
  }
  await loadWeek();
  updateSaveIndicator();
  document.getElementById('presentBtn').disabled = false;
  document.getElementById('presentBtn').textContent = '발표 모드 ▸';

  renderAll();
  presentDeck = activeSlideOrder();
  if(presentDeck.length === 0){
    presentDeck = slideOrder.slice();
  }
  const currentId = activeReportType === 'work'
    ? `work:${activeTeam}`
    : `trend:${activeTeam}:${(activeTrendEntryId[activeTeam] || (trendState[activeTeam][0] && trendState[activeTeam][0].id))}`;
  const idx = presentDeck.indexOf(currentId);
  presentIndex = idx >= 0 ? idx : 0;
  document.querySelector('.app').style.display = 'none';
  document.getElementById('presentView').style.display = 'flex';
  renderPresent();
  document.addEventListener('keydown', presentKeyHandler);
}

function exitPresent(){
  document.getElementById('presentView').style.display = 'none';
  document.querySelector('.app').style.display = 'block';
  document.removeEventListener('keydown', presentKeyHandler);
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}

function nextPresentSlide(){
  if(presentDeck.length === 0) return;
  presentIndex = (presentIndex + 1) % presentDeck.length;
  renderPresent();
}
function prevPresentSlide(){
  if(presentDeck.length === 0) return;
  presentIndex = (presentIndex - 1 + presentDeck.length) % presentDeck.length;
  renderPresent();
}

function presentKeyHandler(e){
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); nextPresentSlide(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); prevPresentSlide(); }
  else if(e.key === 'Escape'){ exitPresent(); }
}

document.getElementById('presentBtn').addEventListener('click', enterPresent);
async function handleRefreshClick(){
  if(isDirty && !confirm('저장하지 않은 변경사항이 있어요. 새로고침하면 사라져요. 계속할까요?')){
    return;
  }
  const btn = document.getElementById('refreshBtn');
  if(btn){ btn.disabled = true; btn.textContent = '불러오는 중...'; }
  await loadWeek();
  isDirty = false;
  updateSaveIndicator();
  renderAll();
  const btn2 = document.getElementById('refreshBtn');
  if(btn2){ btn2.disabled = false; btn2.textContent = '↻ 새로고침'; }
}

  } else {

  requestAnimationFrame(fitPresentStage);
});
window.addEventListener('resize', () => {
  if(document.getElementById('presentView').style.display === 'flex'){
    requestAnimationFrame(fitPresentStage);
  }
});
