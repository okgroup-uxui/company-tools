    const lastItems = (val && Array.isArray(val[blockKey])) ? val[blockKey] : [];
    const filled = lastItems.filter(it => it && it.text && it.text.trim().length > 0);

    if(filled.length === 0){
      btn.disabled = false;
      btn.innerHTML = orig;
      flashBtnHtml(btn, icon('alert-triangle') + ' 지난주 업무가 없어요');
      return;
    }

    // 완전히 빈 기본 항목(빈 줄)은 정리하고, 이미 같은 제목이 있으면 중복 추가하지 않음
    s[blockKey] = s[blockKey].filter(it => it.text || it.category || it.detail || it.remark || it.due);
    const existingTexts = new Set(s[blockKey].map(it => it.text.trim()));
    let addedCount = 0;
    filled.forEach(it => {
      const text = it.text.trim();
      if(existingTexts.has(text)) return;
      s[blockKey].push({
        text,
        category: it.category || '',
        detail: it.detail || '',
        remark: '',
        due: it.due === 'ongoing' ? 'ongoing' : ''
      });
      existingTexts.add(text);
      addedCount++;
    });
    if(s[blockKey].length === 0) s[blockKey].push(emptyItem());

    s.polished[blockKey] = null;
    s.summary = null;
    markDirty(`work:${activeTeam}`);
    renderEditor();
    renderPaper();

    const statusEl = document.getElementById('saveState');
    if(statusEl){
      const msg = addedCount === 0
        ? (icon('check') + ' 이미 모두 있어요')
        : (icon('check') + ` 지난주 업무 ${addedCount}개 불러옴`);
      statusEl.innerHTML = msg;
      setTimeout(() => updateSaveIndicator(), 1800);
    }
  }catch(e){
    btn.disabled = false;
    btn.innerHTML = orig;
    flashBtnHtml(btn, icon('alert-triangle') + ' 불러오기 실패');
  }
}

async function loadWeek(){
  if(!API_BASE_URL){
    resetAll();
    const el = document.getElementById('saveState');
    if(el) el.textContent = '⚠ API 미설정';
    return;
  }
  try{
    const wk = weekKey(currentMonday);
    const workSuffixes = TEAMS.map(t => `work:${t.key}`);
    const trendSuffixes = [];
    TEAMS.forEach(t => (ROSTER[t.key] || []).forEach(name => trendSuffixes.push(`trend:${t.key}:${name}`)));
    const allSuffixes = [...workSuffixes, ...trendSuffixes, 'order'];

    const values = await Promise.all(allSuffixes.map(suf => fetchKV(wk, suf)));

    let anyFound = false;
    const newState = {};
    const newTrendByTeam = {};
    let newOrder = null;

    allSuffixes.forEach((suf, i) => {
      const val = values[i];
      if(val === null || val === undefined) return;
      anyFound = true;
      if(suf.startsWith('work:')){
        newState[suf.slice(5)] = val;
      } else if(suf.startsWith('trend:')){
        const rest = suf.slice(6);
        const sepIdx = rest.indexOf(':');
        const team = rest.slice(0, sepIdx);
        newTrendByTeam[team] = newTrendByTeam[team] || [];
        newTrendByTeam[team].push(val);
      } else if(suf === 'order'){
        newOrder = val;
      }
    });

    if(anyFound){
      TEAMS.forEach(t => {
        if(newState[t.key]){
          const ts = newState[t.key];
          if(!ts.vacation || !ts.vacation.length) ts.vacation = [emptyVacationItem()];
          BLOCKS.forEach(b => {
            if(!ts[b.key]) ts[b.key] = [emptyItem()];
            ts[b.key].forEach(item => {
              if(item.detail === undefined) item.detail = '';
              if(item.remark === undefined) item.remark = '';
            });
          });
          state[t.key] = ts;
        } else {
          state[t.key] = emptyTeamState();
        }
        trendState[t.key] = newTrendByTeam[t.key] || [];
        syncTrendRoster(t.key);
      });
      slideOrder = Array.isArray(newOrder) ? newOrder : [];
      reconcileSlideOrder();
    } else {
      // 새 방식(팀/사람별 키) 데이터가 없으면, 예전 통합 저장 방식 데이터가 있는지 확인해서 불러온다
      const legacy = await fetchKV(wk, null);
      if(legacy){
        state = legacy.state || {};
        trendState = legacy.trendState || {};
        slideOrder = legacy.slideOrder || [];
        TEAMS.forEach(t=>{
          if(!state[t.key]) state[t.key] = emptyTeamState();
          const ts = state[t.key];
          if(!ts.vacation || !ts.vacation.length) ts.vacation = [emptyVacationItem()];
          BLOCKS.forEach(b => {
            if(!ts[b.key]) ts[b.key] = [emptyItem()];
            ts[b.key].forEach(item => {
              if(item.detail === undefined) item.detail = '';
              if(item.remark === undefined) item.remark = '';
            });
          });

          const trend = trendState[t.key];
          if(!trend){
            trendState[t.key] = [];
          } else if(!Array.isArray(trend)){
            trendState[t.key] = [{ id: trend.author || generateId(), author: trend.author||'', title: trend.title||'', image: trend.image||'', content: trend.content||'' }];
          }
          syncTrendRoster(t.key);
        });
        reconcileSlideOrder();
        // 다음부터는 팀/사람별로 나뉜 새 방식으로 저장되도록, 지금 불러온 내용을 새 키들에도 그대로 옮겨 써둔다
        migrateLegacyToGranular(wk).catch(err => console.error('migration failed', err));
      } else {
        resetAll();
      }
    }
  }catch(err){
    console.error('load failed', err);
    resetAll();
  }
}

function resetAll(){
  state = {};
  trendState = {};
  TEAMS.forEach(t => { state[t.key] = emptyTeamState(); trendState[t.key] = emptyTrendState(t.key); });
  activeTrendEntryId = {};
  dirtyKeys = new Set();
  isDirty = false;
  slideOrder = [];
  PRESENT_TEAM_ORDER.forEach(key => { slideOrder.push(`work:${key}`); });
  reconcileSlideOrder();
}

function renderAll(){
  renderWeekRange();
  renderTypeTabs();
  renderTabs();
  renderEditor();
  renderPaper();
}

// ===== Slide helpers (shared by order panel + presentation) =====
function parseSlideId(id){
  const parts = id.split(':');
  return { type: parts[0], team: parts[1], entryId: parts[2] };
}
function findTrendEntry(team, entryId){
  return (trendState[team] || []).find(e => e.id === entryId);
}
function slideHasContent(id){
  const { type, team, entryId } = parseSlideId(id);
  if(type === 'work'){
    const s = state[team];
    if(!s) return false;
    const hasVacation = (s.vacation || []).some(v => v.name.trim().length > 0);
    return hasVacation || BLOCKS.some(b => itemsOf(s, b.key).length > 0);
  } else {
    const s = findTrendEntry(team, entryId);
    if(!s) return false;
    const hasContent = s.content && htmlToPlainText(s.content).length > 0;
    return !!(s.title || (s.images && s.images.length) || hasContent);
  }
}
function slideLabel(id){
  const { type, team, entryId } = parseSlideId(id);
  const t = TEAMS.find(x=>x.key===team);
  if(type === 'work') return `${t.label} · 업무보고`;
  const entry = findTrendEntry(team, entryId);
  const author = entry ? entry.author : '';
  return `${t.label} · 트렌드보고${author ? ' (' + author + ')' : ''}`;
}
function activeSlideOrder(){
  return slideOrder.filter(slideHasContent);
}

// 현재 존재하는 모든 슬라이드 id 목록 (업무보고 3개 + 트렌드보고 항목 전체)
// 업무보고는 디자인팀 > UX/UI팀 > 마케팅팀 순, 트렌드보고는 저장한 시각이 이른 사람부터
function allKnownSlideIds(){
  const ids = [];
  PRESENT_TEAM_ORDER.forEach(key => ids.push(`work:${key}`));
  const trendEntries = [];
  TEAMS.forEach(t => {
    (trendState[t.key] || []).forEach(entry => trendEntries.push({ team: t.key, entry }));
  });
  trendEntries.sort((a, b) => {
    const at = typeof a.entry.savedAt === 'number' ? a.entry.savedAt : Infinity;
    const bt = typeof b.entry.savedAt === 'number' ? b.entry.savedAt : Infinity;
    return at - bt;
  });
  trendEntries.forEach(({team, entry}) => ids.push(`trend:${team}:${entry.id}`));
  return ids;
}
function reconcileSlideOrder(){
  const known = allKnownSlideIds();
  known.forEach(id => { if(!slideOrder.includes(id)) slideOrder.push(id); });
  slideOrder = slideOrder.filter(id => known.includes(id));
}


// ===== Order panel =====
function renderOrderPanel(){
  reconcileSlideOrder();
  const list = document.getElementById('orderList');
  list.innerHTML = '';
  const active = activeSlideOrder();
  if(active.length === 0){
    list.innerHTML = `<div class="order-empty">아직 작성된 보고서가 없어요.</div>`;
    return;
  }
  active.forEach((id, idx) => {
    const row = document.createElement('div');
    row.className = 'order-row';
    row.innerHTML = `<span class="order-num ">0${idx+1}</span><span class="order-label">${slideLabel(id)}</span>`;
    const btns = document.createElement('div');
    btns.className = 'order-btns';
    const up = document.createElement('button');
    up.innerHTML = icon('chevron-up');
    up.setAttribute('aria-label', '위로 이동');
    up.disabled = idx === 0;
    up.onclick = () => { moveSlide(id, -1); };
    const down = document.createElement('button');
    down.innerHTML = icon('chevron-down');
    down.setAttribute('aria-label', '아래로 이동');
    down.disabled = idx === active.length - 1;
    down.onclick = () => { moveSlide(id, 1); };
    btns.appendChild(up); btns.appendChild(down);
    row.appendChild(btns);
    list.appendChild(row);
  });
}
function moveSlide(id, dir){
  const from = slideOrder.indexOf(id);
  let to = from + dir;
  // skip over slides without content when moving, so the visible order matches
  while(to >= 0 && to < slideOrder.length && !slideHasContent(slideOrder[to])){
    to += dir;
  }
  if(to < 0 || to >= slideOrder.length) return;
  const tmp = slideOrder[from];
  slideOrder[from] = slideOrder[to];
  slideOrder[to] = tmp;
  renderOrderPanel();
  markDirty('order');
}

// 트렌드 본문 HTML을 "단락" 단위 블록으로 나눈다.
// contenteditable 결과는 <div>줄 / <br>줄이 섞여 있으므로 먼저 줄 단위로 펼친 뒤,
// 빈 줄을 기준으로 단락을 묶는다. 빈 줄이 하나도 없으면 줄 하나가 곧 단락이 된다.
function splitTrendParagraphs(contentHtml){
  const src = document.createElement('div');
  src.innerHTML = contentHtml || '';
  const BLOCK = /^(DIV|P|H1|H2|H3|H4|H5|H6|UL|OL|BLOCKQUOTE|PRE|TABLE)$/;
  const lines = [];           // 각 줄의 HTML 문자열
  let cur = '';
  const flush = () => { lines.push(cur); cur = ''; };
  const walk = (parent) => {
    Array.from(parent.childNodes).forEach(node => {
      if(node.nodeType === 1 && node.tagName === 'BR'){ flush(); return; }
      if(node.nodeType === 1 && BLOCK.test(node.tagName)){
        if(cur.trim()) flush(); else cur = '';
        if(/^(UL|OL|TABLE|PRE|BLOCKQUOTE)$/.test(node.tagName)){ lines.push(node.outerHTML); return; }
        // div/p 안에 다시 블록이나 br이 있을 수 있으니 재귀로 펼친다
        const hasInnerBreaks = node.querySelector('br, div, p');
        if(hasInnerBreaks){ walk(node); if(cur) flush(); }
        else lines.push(node.innerHTML);
        return;
      }
      cur += node.nodeType === 3 ? escapeHtml(node.textContent) : node.outerHTML;
    });
  };
  walk(src);
  if(cur) flush();

  const isBlank = (h) => {
    const t = document.createElement('div'); t.innerHTML = h;
    return t.textContent.replace(/\u00a0/g,' ').trim() === '';
  };
  const hasBlankSeparator = lines.some((l, i) => isBlank(l) && i > 0 && i < lines.length - 1);
  const paras = [];
  if(hasBlankSeparator){
    let group = [];
    lines.forEach(l => {
      if(isBlank(l)){ if(group.length){ paras.push(group); group = []; } }
      else group.push(l);
    });
    if(group.length) paras.push(group);
  } else {
    lines.filter(l => !isBlank(l)).forEach(l => paras.push([l]));
  }
  return paras.map(g => g.join('<br>'));
}

function buildPresentHtmlForTrend(teamKey, entry){
  const t = TEAMS.find(x=>x.key===teamKey);
  const s = entry;
  const images = s.images || [];

  let html = `
    <div class="p-head">
      <h2>${s.title ? escapeHtml(s.title) : t.label + ' 트렌드보고'}</h2>
      <div class="p-dept">${t.label} ${s.author ? ' · ' + escapeHtml(s.author) : ''}</div>
    </div>
  `;

  if(!s.author && !s.title && images.length === 0 && !s.content){
    html += `<div class="p-empty" style="margin-top:20px;">작성된 내용이 없습니다.</div>`;
    return html;
  }

  const paras = splitTrendParagraphs(s.content);
  const textHtml = paras.length
    ? `<div class="p-trend-body">${paras.map(p => `<div class="p-step">${p}</div>`).join('')}</div>`
    : '';

  const layout = s.slideLayout === 'column' ? 'column' : 'row';
  // 상하형에서는 이미지를 세로로 쌓으면 텍스트 자리가 사라지므로 항상 가로로 나란히 둔다
  const imgDir = layout === 'column' ? 'row' : (s.imageLayout === 'column' ? 'column' : 'row');
  const imgsHtml = images.length
    ? `<div class="p-trend-images" style="flex-direction:${imgDir};">${images.map(src => `<img src="${src}" alt="">`).join('')}</div>`
    : '';

  if(layout === 'row'){
    // 좌우형: 이미지는 왼쪽에 고정, 오른쪽 텍스트만 단락 단위로 넘어간다
    html += `<div class="p-trend p-trend-row${images.length ? '' : ' no-img'}">
      ${imgsHtml}
      <div class="p-scroll-area p-trend-text">${textHtml}</div>
    </div>`;
  } else {
    // 상하형: 이미지는 화면 높이 기준으로 크기를 제한하고, 진행하면 위로 밀려 올라간다
    html += `<div class="p-trend p-trend-col">
      <div class="p-scroll-area p-trend-text">
        ${imgsHtml}
        ${textHtml}
      </div>
    </div>`;
  }
  html += `<div class="p-more" aria-hidden="true">${icon('chevron-down')} 이어서</div>`;

  return html;
}

function renderPresent(){
  const id = presentDeck[presentIndex];
  if(!id){
    document.getElementById('presentStage').innerHTML = `<div class="p-empty">발표할 보고서가 없어요.</div>`;
    document.getElementById('presentIndex').textContent = `00 / 00`;
    return;
  }
  const { type, team, entryId } = parseSlideId(id);
  if(type === 'work'){
    document.getElementById('presentStage').innerHTML = buildPresentHtmlForWork(team);
  } else {
    const entry = findTrendEntry(team, entryId);
    document.getElementById('presentStage').innerHTML = entry
      ? buildPresentHtmlForTrend(team, entry)
      : `<div class="p-empty">삭제된 항목이에요.</div>`;
  }
  if(stepAnim){ cancelAnimationFrame(stepAnim.raf); stepAnim = null; }
  const areaNow = currentScrollArea();
  if(areaNow){
    areaNow.scrollTop = 0;
    areaNow.addEventListener('scroll', () => { if(!stepAnim) updateMoreHint(); });
    // 이미지가 늦게 로드되면 높이가 바뀌므로 다시 계산
    areaNow.querySelectorAll('img').forEach(img => img.addEventListener('load', () => updateMoreHint()));
  }
  requestAnimationFrame(() => updateMoreHint());
  document.getElementById('presentIndex').innerHTML =
    `<span class="pi-num">${String(presentIndex+1).padStart(2,'0')} / ${String(presentDeck.length).padStart(2,'0')}</span><span class="pi-label">${escapeHtml(slideLabel(id))}</span>`;
  document.getElementById('presentRange').textContent = nextWeekLabel(currentMonday);

  const dots = document.getElementById('presentDots');
  dots.innerHTML = '';
  presentDeck.forEach((slideId, i) => {
    const dot = document.createElement('button');
    dot.className = 'present-dot' + (i === presentIndex ? ' active' : '');
    dot.title = slideLabel(slideId);
    dot.onclick = () => { presentIndex = i; renderPresent(); };
    dots.appendChild(dot);
  });
}

  document.querySelector('.app').style.display = 'block';
  document.removeEventListener('keydown', presentKeyHandler);
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}

function nextPresentSlide(){
  if(presentDeck.length === 0) return;
  presentIndex = (presentIndex + 1) % presentDeck.length;
  renderPresent();
}
function prevPresentSlide(){
  if(presentDeck.length === 0) return;
  presentIndex = (presentIndex - 1 + presentDeck.length) % presentDeck.length;
  renderPresent();
}

// ===== 단락 단위 진행 =====
// 다음(→): 아직 다 안 보이는 다음 단락 하나가 화면 아래에 완전히 들어오도록 부드럽게 올린다.
// 이전(←): 위로 가려진 단락 하나가 화면 위에 다시 들어오도록 내린다.
// 더 보여줄 단락이 없으면 그때 슬라이드를 넘긴다.
const STEP_PAD = 12;          // 단락 위/아래 여백(px)
const STEP_DURATION = 420;    // 스크롤 애니메이션 시간(ms)
let stepAnim = null;          // { area, target, raf }

function currentScrollArea(){
  return document.querySelector('#presentStage .p-scroll-area');
}
function areaScrollPos(area){
  // 애니메이션 중이면 최종 목적지를 기준으로 계산해서, 연타해도 단락이 건너뛰지 않게 한다
  return (stepAnim && stepAnim.area === area) ? stepAnim.target : area.scrollTop;
}
function stepUnits(area){
  const areaTop = area.getBoundingClientRect().top - area.scrollTop;
  return Array.from(area.querySelectorAll('.p-step')).map(el => {
    const r = el.getBoundingClientRect();
    return { top: r.top - areaTop, bottom: r.bottom - areaTop };
  });
}
function easeInOut(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }
function animateScroll(area, target){
  const max = area.scrollHeight - area.clientHeight;
  target = Math.max(0, Math.min(max, target));
  if(stepAnim) cancelAnimationFrame(stepAnim.raf);
  const from = area.scrollTop;
  const start = performance.now();
  stepAnim = { area, target, raf: 0 };
  const tick = (now) => {
    const p = Math.min(1, (now - start) / STEP_DURATION);
    area.scrollTop = from + (target - from) * easeInOut(p);
    if(p < 1) stepAnim.raf = requestAnimationFrame(tick);
    else { stepAnim = null; updateMoreHint(); }
  };
  stepAnim.raf = requestAnimationFrame(tick);
  updateMoreHint(target);
}
function updateMoreHint(pos){
  const area = currentScrollArea();
  const hint = document.querySelector('#presentStage .p-more');
  if(!area || !hint) return;
  const top = typeof pos === 'number' ? pos : area.scrollTop;
  const remaining = area.scrollHeight - area.clientHeight - top;
  hint.classList.toggle('show', remaining > 4);
}

function advanceOrScroll(direction){
  const area = currentScrollArea();
  if(area && area.scrollHeight > area.clientHeight + 2){
    const view = area.clientHeight;
    const pos = areaScrollPos(area);
    const max = area.scrollHeight - view;
    const units = stepUnits(area);

    if(direction > 0 && pos < max - 2){
      const next = units.find(u => u.bottom > pos + view - 1);
      let target;
      if(!next) target = max;
      else if(next.bottom - next.top > view - STEP_PAD * 2) target = next.top - STEP_PAD;   // 화면보다 긴 단락은 머리부터
      else target = next.bottom - view + STEP_PAD;
      // 이미 머리가 위에 걸쳐 있는 긴 단락이면 한 화면씩 내린다
      if(target <= pos + 2) target = Math.min(max, pos + view * 0.8);
      animateScroll(area, target);
      return;
    }
    if(direction < 0 && pos > 2){
      const prev = units.slice().reverse().find(u => u.top < pos + 1);
      let target = prev ? prev.top - STEP_PAD : 0;
      if(prev && (pos - target) > view) target = pos - view * 0.8;   // 긴 단락은 한 화면씩
      if(target >= pos - 2) target = 0;
      animateScroll(area, target);
      return;
    }
  }
  if(direction > 0) nextPresentSlide();
  else prevPresentSlide();
}

function presentKeyHandler(e){
  document.getElementById('presentView').classList.add('idle');
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); advanceOrScroll(1); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); advanceOrScroll(-1); }
  else if(e.key === 'Escape'){ exitPresent(); }
}

document.getElementById('presentBtn').addEventListener('click', enterPresent);
async function handleRefreshClick(){
  if(isDirty && !confirm('저장하지 않은 변경사항이 있어요. 새로고침하면 사라져요. 계속할까요?')){
    return;
  }
  const btn = document.getElementById('refreshBtn');
  if(btn){ btn.disabled = true; btn.textContent = '불러오는 중...'; }
  await loadWeek();
  dirtyKeys.clear();
  isDirty = false;
  updateSaveIndicator();
  renderAll();
  const btn2 = document.getElementById('refreshBtn');
  if(btn2){ btn2.disabled = false; btn2.innerHTML = icon('refresh') + ' 새로고침'; }
}
document.addEventListener('keydown', (e) => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    e.preventDefault();
    clearTimeout(autosaveTimer);
    handleSaveClick();
  }
});
window.addEventListener('beforeunload', (e) => {
  if(isDirty){
    e.preventDefault();
    e.returnValue = '';
  }
});
document.getElementById('exitPresentBtn').addEventListener('click', exitPresent);
document.getElementById('presentPrev').addEventListener('click', () => advanceOrScroll(-1));
document.getElementById('presentNext').addEventListener('click', () => advanceOrScroll(1));
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  const el = document.getElementById('presentView');
  if(!document.fullscreenElement){
    el.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
});


(async function init(){
  await loadWeek();
  renderAll();
  document.getElementById('saveState').textContent = '';
})();
</script>
