<meta name="theme-color" content="#211812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="습관트래커">

<style>
  :root{
    --paper:#FAF7F1;
    --ink:#211812;
    --ink-soft:#4A4038;
    --lavender:#C9C7F2;
    --mocha:#A48B76;
    --coral:#EF3A24;
    --coral-soft:#F8E0DB;
    --yellow:#FBEEA6;
    --line:#E4DFD5;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab-btn{
    font-size:15px;font-weight:700;letter-spacing:.02em;
    padding:10px 18px;border-radius:10px 10px 0 0;
    border:1px solid var(--line);background:var(--white);color:var(--ink-soft);
    cursor:pointer;
  }
  .tab-btn.active{background:var(--ink);color:var(--white);border-color:var(--ink);}

  .panel{display:none;}
  .panel.active{display:block;}

  /* ---- top row: date + nav ---- */
  .top-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .date-card{
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:14px 18px;min-width:220px;flex:0 0 auto;
  }
  .date-card .label{
    font-weight:700;font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;
  }
  .date-card .nav{display:flex;align-items:center;gap:10px;}
  .date-card .nav button{
    border:1px solid var(--line);background:var(--paper);border-radius:8px;
    width:30px;height:30px;font-size:15px;cursor:pointer;color:var(--ink);
  }
  .date-card .ym{font-weight:700;font-size:16px;flex:1;text-align:center;}
  .date-card .big{
    display:flex;align-items:baseline;gap:12px;margin-top:10px;
  }
  .date-card .day-num{
    font-weight:800;font-size:56px;line-height:1;color:var(--ink);
  }
  .date-card .weekday{
    font-weight:700;font-size:18px;color:var(--coral);
  }

  .stat-cards{display:flex;gap:10px;flex:1;flex-wrap:wrap;}
  .stat-card{
    flex:1;min-width:130px;border-radius:14px;padding:14px 16px;
    display:flex;flex-direction:column;justify-content:space-between;
    border:1px solid var(--line);
  }
  .stat-card .k{font-size:12px;font-weight:700;color:var(--ink-soft);opacity:.8;margin-bottom:6px;}
  .stat-card .v{
    font-weight:800;font-size:34px;line-height:1;color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .stat-card .sub{font-size:11px;color:var(--ink-soft);margin-top:8px;opacity:.75;}
  .sc-goal{background:var(--lavender);}
  .sc-avg{background:var(--mocha);color:#2a221b;}
  .sc-avg .k, .sc-avg .v, .sc-avg .sub{color:#241d16;}
  .sc-perfect{background:var(--coral);}
  .sc-perfect .k, .sc-perfect .v, .sc-perfect .sub{color:#fff;}
  .sc-streak{background:var(--yellow);}

  /* mood tally strip */
  .mood-strip{
    display:flex;align-items:center;gap:0;background:var(--white);flex-wrap:wrap;
    border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;
  }
  .mood-cell{
    flex:1;min-width:44px;text-align:center;padding:10px 4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  .mood-cell:last-child{border-right:none;}
  .mood-cell .emo{font-size:18px;}
  .mood-cell .cnt{font-weight:700;font-size:14px;margin-top:2px;color:var(--ink-soft);}

  /* section title bar */
  .section-bar{
    background:var(--ink);color:var(--white);font-weight:700;
    letter-spacing:.04em;padding:9px 14px;border-radius:10px 10px 0 0;font-size:13px;
  }

  /* bar chart (오늘의 달성도) */
  .chart-box{border:1px solid var(--line);border-radius:0 0 10px 10px;background:var(--white);padding:14px;margin-bottom:16px;}
  .bar-row{display:flex;align-items:flex-end;height:110px;gap:3px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar-col .bar{width:100%;max-width:22px;border-radius:3px 3px 0 0;background:var(--mocha);}
  .bar-col.today .bar{background:var(--lavender);}
  .bar-col .pct{font-size:9px;color:var(--ink-soft);margin-bottom:2px;}
  .bar-col .dnum{font-size:9px;color:var(--ink-soft);margin-top:4px;}

  /* habits grid */
  .grid-wrap{border:1px solid var(--line);border-radius:0 0 10px 10px;background:var(--white);overflow-x:auto;}
  table{border-collapse:collapse;table-layout:fixed;}
  th,td{border:1px solid var(--line);padding:0;text-align:center;overflow:hidden;}
  .week-head th{
    background:var(--ink);color:var(--white);font-weight:700;
    font-size:11px;padding:6px 2px;letter-spacing:.03em;
  }
  .day-head th{
    background:#F1EDE3;font-size:11px;font-weight:700;color:var(--ink-soft);padding:5px 2px;
  }
  .day-head .wd{display:block;}
  .day-head .dn{display:block;font-size:12px;color:var(--ink);}
  th.today,td.today{background:var(--yellow) !important;}
  .habit-label-head{
    background:var(--coral);color:#fff;font-weight:800;
    font-size:16px;text-align:left;padding:10px 14px;letter-spacing:.02em;
  }
  .row-mood{background:#FBF9F4;}
  .row-mood td{padding:6px 0;font-size:15px;cursor:pointer;user-select:none;}
  .row-mood td:hover{background:#F1EDE3;}

  /* emoji picker popover */
  .emoji-picker{
    position:fixed;z-index:1000;background:var(--white);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 8px 24px rgba(33,24,18,0.18);padding:10px;
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:246px;
  }
  .emoji-picker button{
    border:none;background:none;font-size:18px;padding:5px 0;border-radius:6px;cursor:pointer;
    line-height:1;
  }
  .emoji-picker button:hover{background:var(--yellow);}
  .emoji-picker .clear-btn{
    grid-column:1 / -1;margin-top:4px;padding:6px 0;font-size:11px;font-weight:700;
    color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:6px;
  }
  .emoji-picker .clear-btn:hover{background:#F1EDE3;}
  .habit-row td.label-cell{
    text-align:left;padding:8px 30px 8px 12px;font-size:12.5px;white-space:normal;
    word-break:keep-all;line-height:1.35;vertical-align:middle;position:relative;
  }
  .habit-row .tag{
    display:inline-block;font-size:10px;font-weight:700;color:var(--coral);margin-right:3px;
  }
  .habit-row .pct-cell{width:46px;font-size:11px;color:var(--ink-soft);font-weight:700;}
  .del-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:#c9c2b6;cursor:pointer;font-size:13px;padding:2px 4px;
  }
  .del-btn:hover{color:var(--coral);}
  .chk-cell{cursor:pointer;padding:9px 0;}
  .chk-cell .box{
    width:16px;height:16px;border:1.5px solid #c9c2b6;border-radius:3px;margin:0 auto;
    display:flex;align-items:center;justify-content:center;background:#fff;
  }
  .chk-cell.checked .box{background:var(--ink);border-color:var(--ink);color:#fff;font-size:11px;}
  .chk-cell.blank{background:#F6F4EF;cursor:default;}
  .week-pct-row td{background:var(--lavender);font-weight:800;font-size:12px;color:var(--ink);padding:8px 0;}
  .week-pct-row td.label-cell{background:var(--coral);color:#fff;text-align:left;padding:8px 12px;}

  /* add habit form */
  .add-row{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);}
  .tag-btn{
    border:1px solid var(--line);background:var(--paper);border-radius:6px;font-size:11px;
    padding:5px 9px;cursor:pointer;color:var(--ink-soft);font-weight:700;
  }
  .tag-btn.picked{background:var(--coral);color:#fff;border-color:var(--coral);}
  .habit-input{
    flex:1;min-width:160px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;
  }
  .add-btn{
    background:var(--ink);color:#fff;border:none;border-radius:6px;padding:8px 16px;
    font-weight:700;font-size:12.5px;cursor:pointer;
  }
  .add-btn:hover{background:var(--coral);}

  .hint{font-size:11px;color:var(--ink-soft);opacity:.7;margin-top:8px;}

  /* charts (review tab) */
  .chart-svg-box{
    border:1px solid var(--line);border-radius:0 0 10px 10px;background:var(--white);
    padding:14px;margin-bottom:16px;
  }
  .review-stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;}
  .review-stats .stat-card{min-width:180px;}
  .review-stats .v{font-size:48px;}

  @media (max-width:640px){
    .top-row{flex-direction:column;}
    .stat-cards{flex-direction:row;}
    .date-card .day-num{font-size:44px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="tabs">
    <button class="tab-btn active" data-tab="tracker">📋 Monthly Tracker</button>
    <button class="tab-btn" data-tab="review">📊 Monthly Review</button>
  </div>

  <section class="panel active" id="panel-tracker"></section>
  <section class="panel" id="panel-review"></section>
</div>

<script>
const EMOJIS = [
  '😀','😄','😆','🥳','😊','🙂','😌','😐','😑','😶',
  '😕','🙁','😞','😢','😭','😠','😤','🥺','😰','😨',
  '😴','🤒','🤕','🥵','🥶','🤢','😵',
  '🔥','❤️','🎉','✈️','💪','📚','☕','🏥'
];
const CATEGORY_TAGS = ['건강','공부','기록','루틴'];

const now = new Date();
let state = {
  year: now.getFullYear(),
  month: now.getMonth()+1,
  habits: [],
  monthData: {checks:{}, emoji:{}},
  pickedTag: null,
  loaded: false
};

function pad(n){ return String(n).padStart(2,'0'); }
function dateStr(y,m,d){ return `${y}-${pad(m)}-${pad(d)}`; }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function habitsKey(){ return 'habits-list'; }
function monthKey(y,m){ return `month-data:${y}-${pad(m)}`; }
function weekdayKorForDate(y,m,d){
  const wd = new Date(y,m-1,d).getDay();
  return ['일','월','화','수','목','금','토'][wd];
}
function uid(){ return 'h'+Date.now()+Math.random().toString(16).slice(2,6); }

async function storageGet(key){
  try{
    const v = localStorage.getItem('habit-tracker:'+key);
    if(v !== null) return v;
  }catch(e){ /* localStorage unavailable, fall through */ }
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }
  }catch(e){ /* not found or unavailable */ }
  return null;
}
async function storageSet(key, value){
  let savedLocally = false;
  try{
    localStorage.setItem('habit-tracker:'+key, value);
    savedLocally = true;
  }catch(e){ console.error('localStorage save failed', e); }
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, value, false);
    }
  }catch(e){ if(!savedLocally) console.error('storage save failed', e); }
}

async function loadHabits(){
  const raw = await storageGet(habitsKey());
  state.habits = raw ? JSON.parse(raw) : [];
}
async function saveHabits(){
  await storageSet(habitsKey(), JSON.stringify(state.habits));
}
async function loadMonthData(){
  const raw = await storageGet(monthKey(state.year, state.month));
  state.monthData = raw ? JSON.parse(raw) : {checks:{}, emoji:{}};
}
async function saveMonthData(){
  await storageSet(monthKey(state.year, state.month), JSON.stringify(state.monthData));
}

function buildWeeks(y,m){
  const dim = daysInMonth(y,m);
  const firstWd = (new Date(y,m-1,1).getDay()+6)%7; // 0=Mon
  const weeks = [];
  let cur = [];
  for(let i=0;i<firstWd;i++) cur.push(null);
  for(let d=1; d<=dim; d++){
    cur.push(d);
    if(cur.length===7){ weeks.push(cur); cur=[]; }
  }
  if(cur.length){ while(cur.length<7) cur.push(null); weeks.push(cur); }
  return weeks;
}

function isCurrentRealMonth(y,m){
  return y===now.getFullYear() && m===(now.getMonth()+1);
}
function elapsedDays(y,m){
  const dim = daysInMonth(y,m);
  const realY=now.getFullYear(), realM=now.getMonth()+1, realD=now.getDate();
  if(y<realY || (y===realY && m<realM)) return dim;
  if(y>realY || (y===realY && m>realM)) return 0;
  return realD;
}

function dayRate(y,m,d){
  if(!state.habits.length) return 0;
  const ds = dateStr(y,m,d);
  const dayChecks = state.monthData.checks[ds] || {};
  let done = 0;
  state.habits.forEach(h=>{ if(dayChecks[h.id]) done++; });
  return Math.round(done/state.habits.length*100);
}

function computeStats(){
  const y=state.year, m=state.month;
  const dim = daysInMonth(y,m);
  const elapsed = elapsedDays(y,m);
  let totalChecked = 0;
  Object.values(state.monthData.checks).forEach(dayObj=>{
    Object.values(dayObj).forEach(v=>{ if(v) totalChecked++; });
  });
  let sumRate = 0, perfectDays = 0;
  let ratesElapsed = [];
  for(let d=1; d<=elapsed; d++){
    const r = dayRate(y,m,d);
    ratesElapsed.push(r);
    sumRate += r;
    if(r===100) perfectDays++;
  }
  const avgRate = elapsed>0 ? Math.round(sumRate/elapsed) : 0;
  // max consecutive streak of 100% days among elapsed days
  let maxStreak=0, cur=0;
  ratesElapsed.forEach(r=>{
    if(r===100){ cur++; maxStreak=Math.max(maxStreak,cur); } else { cur=0; }
  });
  return {
    totalChecked,
    totalGoal: state.habits.length * dim,
    avgRate,
    perfectDays,
    maxStreak,
    elapsed,
    dim
  };
}

function moodTally(){
  const counts = {};
  EMOJIS.forEach(e=>counts[e]=0);
  Object.values(state.monthData.emoji).forEach(e=>{ if(counts[e]!==undefined) counts[e]++; });
  return counts;
}

function fmtDate(y,m){ return `${y}년 ${m}월`; }

/* ---------------- render: tracker tab ---------------- */
function renderTracker(){
  const el = document.getElementById('panel-tracker');
  const y=state.year, m=state.month;
  const dim = daysInMonth(y,m);
  const today = now.getDate();
  const todayDs = dateStr(y,m,today);
  const stats = computeStats();
  const weeks = buildWeeks(y,m);
  const mood = moodTally();

  let html = '';

  // top row
  html += `<div class="top-row">
    <div class="date-card">
      <div class="label">Monthly Tracker</div>
      <div class="nav">
        <button data-act="prev-month">‹</button>
        <div class="ym">${fmtDate(y,m)}</div>
        <button data-act="next-month">›</button>
      </div>
      ${isCurrentRealMonth(y,m) ? `<div class="big"><div class="day-num">${today}</div><div class="weekday">${weekdayKorForDate(y,m,today)}</div></div>` : ''}
    </div>
    <div class="stat-cards">
      <div class="stat-card sc-goal"><div class="k">완료된 목표 수</div><div class="v">${stats.totalChecked}</div><div class="sub">전체 목표 ${stats.totalGoal}개</div></div>
      <div class="stat-card sc-avg"><div class="k">일 평균 달성률</div><div class="v">${stats.avgRate}%</div><div class="sub">일 목표 ${state.habits.length}개</div></div>
      <div class="stat-card sc-perfect"><div class="k">100% 달성일</div><div class="v">${stats.perfectDays}</div><div class="sub">이번달 일수 ${stats.dim}</div></div>
      <div class="stat-card sc-streak"><div class="k">연속 달성일</div><div class="v">${stats.maxStreak}</div><div class="sub">이번달 일수 ${stats.dim}</div></div>
    </div>
  </div>`;

  // mood tally strip — only show emojis actually used this month, most-used first
  const usedMoods = EMOJIS.filter(e=>mood[e]>0).sort((a,b)=>mood[b]-mood[a]);
  html += `<div class="mood-strip">`;
  if(usedMoods.length){
    usedMoods.forEach(e=>{
      html += `<div class="mood-cell"><div class="emo">${e}</div><div class="cnt">${mood[e]}</div></div>`;
    });
  } else {
    html += `<div class="mood-cell" style="flex:1;color:var(--ink-soft);font-size:12px;">아직 기록된 오늘의 상태가 없어요 — 아래 표에서 칸을 눌러 골라보세요</div>`;
  }
  html += `</div>`;

  // bar chart: 오늘의 달성도
  html += `<div class="section-bar">오늘의 달성도</div>
  <div class="chart-box"><div class="bar-row">`;
  for(let d=1; d<=dim; d++){
    const r = dayRate(y,m,d);
    const isToday = isCurrentRealMonth(y,m) && d===today;
    html += `<div class="bar-col ${isToday?'today':''}">
      <div class="pct">${r>0?r+'%':''}</div>
      <div class="bar" style="height:${Math.max(r,2)}%;"></div>
      <div class="dnum">${d}</div>
    </div>`;
  }
  html += `</div></div>`;

  // habits grid
  const totalDays = weeks.length * 7;
  const dayColWidth = 34;
  const labelColWidth = 230;
  const tableWidth = 44 + labelColWidth + dayColWidth * totalDays;
  html += `<div class="section-bar">HABITS</div><div class="grid-wrap"><table style="width:${tableWidth}px;">`;
  html += `<colgroup><col style="width:44px;"><col style="width:${labelColWidth}px;">`;
  for(let i=0;i<totalDays;i++){ html += `<col style="width:${dayColWidth}px;">`; }
  html += `</colgroup>`;

  // week header row (label spans 2 leading cols + 2 rows, matching pct+label cols in body rows)
  html += `<tr class="week-head"><th colspan="2" rowspan="2" class="habit-label-head" style="min-width:200px;">HABITS</th>`;
  weeks.forEach((w,i)=>{ html += `<th colspan="7">WEEK ${i+1}</th>`; });
  html += `</tr>`;

  // day header row (no leading cells — rowspan above already covers those 2 columns)
  html += `<tr class="day-head">`;
  weeks.forEach(w=>{
    w.forEach(d=>{
      if(d===null){ html += `<th></th>`; return; }
      const isToday = isCurrentRealMonth(y,m) && d===today;
      html += `<th class="${isToday?'today':''}"><span class="wd">${weekdayKorForDate(y,m,d)}</span><span class="dn">${d}</span></th>`;
    });
  });
  html += `</tr>`;

  // mood row
  html += `<tr class="row-mood"><td colspan="2" style="text-align:left;padding-left:12px;font-size:11px;color:#4A4038;font-weight:700;">오늘의 상태</td>`;
  weeks.forEach(w=>{
    w.forEach(d=>{
      if(d===null){ html += `<td></td>`; return; }
      const ds = dateStr(y,m,d);
      const isToday = isCurrentRealMonth(y,m) && d===today;
      const e = state.monthData.emoji[ds] || '';
      html += `<td class="${isToday?'today':''}" data-mood-day="${d}">${e}</td>`;
    });
  });
  html += `</tr>`;

  // habit rows
  state.habits.forEach(h=>{
    let done=0, denom=0;
    for(let d=1; d<=stats.elapsed; d++){
      denom++;
      const ds = dateStr(y,m,d);
      if(state.monthData.checks[ds] && state.monthData.checks[ds][h.id]) done++;
    }
    const pct = denom>0 ? Math.round(done/denom*100) : 0;
    html += `<tr class="habit-row">
      <td class="pct-cell">${pct}%</td>
      <td class="label-cell" colspan="1" style="position:relative;min-width:${labelColWidth-40}px;">
        ${h.category?`<span class="tag">[${h.category}]</span>`:''}${escapeHtml(h.name)}
        <button class="del-btn" data-act="del-habit" data-id="${h.id}">✕</button>
      </td>`;
    // remove the extra 2 header cols alignment: we need consistent col count -> adjust below
    weeks.forEach(w=>{
      w.forEach(d=>{
        if(d===null){ html += `<td class="chk-cell blank"></td>`; return; }
        const ds = dateStr(y,m,d);
        const checked = !!(state.monthData.checks[ds] && state.monthData.checks[ds][h.id]);
        const isToday = isCurrentRealMonth(y,m) && d===today;
        html += `<td class="chk-cell ${checked?'checked':''} ${isToday?'today':''}" data-act="toggle" data-habit="${h.id}" data-day="${d}">
          <div class="box">${checked?'✓':''}</div>
        </td>`;
      });
    });
    html += `</tr>`;
  });

  // week pct footer row
  html += `<tr class="week-pct-row"><td class="label-cell" colspan="2">이번주 달성도</td>`;
  weeks.forEach(w=>{
    const validDays = w.filter(d=>d!==null && d<=stats.elapsed);
    let avg = 0;
    if(validDays.length){
      avg = Math.round(validDays.reduce((s,d)=>s+dayRate(y,m,d),0)/validDays.length);
    }
    html += `<td colspan="7">${validDays.length? avg+'%' : '-'}</td>`;
  });
  html += `</tr>`;

  html += `</table></div>`;

  // add habit row
  html += `<div class="grid-wrap" style="margin-top:10px;">
    <div class="add-row">
      ${CATEGORY_TAGS.map(t=>`<button class="tag-btn ${state.pickedTag===t?'picked':''}" data-act="pick-tag" data-tag="${t}">[${t}]</button>`).join('')}
      <input type="text" id="new-habit-input" class="habit-input" placeholder="새 습관 이름 입력 (예: 저녁 산책 20분)" />
      <button class="add-btn" data-act="add-habit">+ 습관 추가</button>
    </div>
    <div class="hint" style="padding:0 14px 10px;">체크칸을 클릭하면 완료 표시, 오늘의 상태 칸을 클릭하면 다양한 표정 중에서 골라요 (우클릭하면 지워져요). 데이터는 자동 저장돼요.</div>
  </div>`;

  el.innerHTML = html;
  attachTrackerEvents(el);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let activePicker = null;
function closeEmojiPicker(){
  if(activePicker){ activePicker.remove(); activePicker = null; }
  document.removeEventListener('click', onDocClickCloseP, true);
}
function onDocClickCloseP(e){
  if(activePicker && !activePicker.contains(e.target)){ closeEmojiPicker(); }
}
function openEmojiPicker(cellEl, day){
  closeEmojiPicker();
  const ds = dateStr(state.year, state.month, day);
  const panel = document.createElement('div');
  panel.className = 'emoji-picker';
  panel.innerHTML = EMOJIS.map(e=>`<button type="button" data-emoji="${e}">${e}</button>`).join('')
    + `<button type="button" class="clear-btn" data-emoji="">지우기</button>`;
  document.body.appendChild(panel);

  const rect = cellEl.getBoundingClientRect();
  const panelW = 246;
  let left = rect.left + rect.width/2 - panelW/2;
  left = Math.max(8, Math.min(left, window.innerWidth - panelW - 8));
  let top = rect.bottom + 6;
  if(top + 160 > window.innerHeight){ top = rect.top - 160 - 6; }
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';

  panel.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const val = b.getAttribute('data-emoji');
      if(val){ state.monthData.emoji[ds] = val; } else { delete state.monthData.emoji[ds]; }
      await saveMonthData();
      closeEmojiPicker();
      renderTracker();
    });
  });

  activePicker = panel;
  setTimeout(()=>document.addEventListener('click', onDocClickCloseP, true), 0);
}

function attachTrackerEvents(el){
  el.querySelectorAll('[data-act="prev-month"]').forEach(b=>b.addEventListener('click', ()=>changeMonth(-1)));
  el.querySelectorAll('[data-act="next-month"]').forEach(b=>b.addEventListener('click', ()=>changeMonth(1)));

  el.querySelectorAll('[data-act="toggle"]').forEach(td=>{
    td.addEventListener('click', async ()=>{
      const habitId = td.getAttribute('data-habit');
      const day = parseInt(td.getAttribute('data-day'),10);
      const ds = dateStr(state.year, state.month, day);
      if(!state.monthData.checks[ds]) state.monthData.checks[ds] = {};
      state.monthData.checks[ds][habitId] = !state.monthData.checks[ds][habitId];
      await saveMonthData();
      renderTracker();
    });
  });

  el.querySelectorAll('[data-mood-day]').forEach(td=>{
    td.addEventListener('click', (e)=>{
      const day = parseInt(td.getAttribute('data-mood-day'),10);
      openEmojiPicker(td, day);
    });
    td.addEventListener('contextmenu', async (e)=>{
      e.preventDefault();
      const day = parseInt(td.getAttribute('data-mood-day'),10);
      const ds = dateStr(state.year, state.month, day);
      delete state.monthData.emoji[ds];
      await saveMonthData();
      renderTracker();
    });
  });

  el.querySelectorAll('[data-act="del-habit"]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = b.getAttribute('data-id');
      if(!confirm('이 습관을 삭제할까요? 기록은 유지되지 않아요.')) return;
      state.habits = state.habits.filter(h=>h.id!==id);
      await saveHabits();
      renderTracker();
    });
  });

  el.querySelectorAll('[data-act="pick-tag"]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const t = b.getAttribute('data-tag');
      state.pickedTag = state.pickedTag===t ? null : t;
      renderTracker();
      document.getElementById('new-habit-input')?.focus();
    });
  });

  const addBtn = el.querySelector('[data-act="add-habit"]');
  const input = el.querySelector('#new-habit-input');
  const doAdd = async ()=>{
    const name = input.value.trim();
    if(!name) return;
    state.habits.push({id: uid(), name, category: state.pickedTag});
    state.pickedTag = null;
    await saveHabits();
    renderTracker();
  };
  addBtn?.addEventListener('click', doAdd);
  input?.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doAdd(); });
}

async function changeMonth(delta){
  let m = state.month + delta;
  let y = state.year;
  if(m<1){ m=12; y--; }
  if(m>12){ m=1; y++; }
  state.year = y; state.month = m;
  await loadMonthData();
  renderTracker();
  renderReview();
}

/* ---------------- render: review tab ---------------- */
function renderReview(){
  const el = document.getElementById('panel-review');
  const y=state.year, m=state.month;
  const dim = daysInMonth(y,m);
  const stats = computeStats();

  const rates = [];
  for(let d=1; d<=dim; d++) rates.push(dayRate(y,m,d));

  let html = '';
  html += `<div class="top-row">
    <div class="date-card">
      <div class="label">Monthly Review</div>
      <div class="nav">
        <button data-act="prev-month">‹</button>
        <div class="ym">${fmtDate(y,m)}</div>
        <button data-act="next-month">›</button>
      </div>
    </div>
  </div>`;

  html += `<div class="review-stats">
    <div class="stat-card sc-goal"><div class="k">완료된 목표 수</div><div class="v">${stats.totalChecked}</div><div class="sub">전체 목표 ${stats.totalGoal}개</div></div>
    <div class="stat-card sc-avg"><div class="k">일 평균 달성률</div><div class="v">${stats.avgRate}%</div><div class="sub">일 목표 ${state.habits.length}개</div></div>
    <div class="stat-card sc-perfect"><div class="k">100% 달성일</div><div class="v">${stats.perfectDays}</div><div class="sub">이번달 일수 ${stats.dim}</div></div>
    <div class="stat-card sc-streak"><div class="k">연속 달성일</div><div class="v">${stats.maxStreak}</div><div class="sub">이번달 일수 ${stats.dim}</div></div>
  </div>`;

  html += `<div class="section-bar">일별 달성률</div><div class="chart-svg-box">${lineChartSvg(rates)}</div>`;

  const cumulative = [];
  let sum=0;
  rates.forEach((r,i)=>{ sum += r; cumulative.push(Math.round(sum/(i+1))); });
  html += `<div class="section-bar">누적 달성률</div><div class="chart-svg-box">${areaChartSvg(cumulative)}</div>`;

  el.innerHTML = html;
  el.querySelectorAll('[data-act="prev-month"]').forEach(b=>b.addEventListener('click', ()=>changeMonth(-1)));
  el.querySelectorAll('[data-act="next-month"]').forEach(b=>b.addEventListener('click', ()=>changeMonth(1)));
}

function lineChartSvg(values){
  const w=1000, h=220, padL=36, padR=10, padT=14, padB=24;
  const n = values.length;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const stepX = n>1 ? innerW/(n-1) : innerW;
  const yFor = v => padT + innerH - (v/100)*innerH;
  const xFor = i => padL + i*stepX;
  let pts = values.map((v,i)=>`${xFor(i)},${yFor(v)}`).join(' ');
  let grid = '';
  [0,25,50,75,100].forEach(g=>{
    const gy = yFor(g);
    grid += `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#E4DFD5" stroke-width="1"/>
    <text x="4" y="${gy+3}" font-size="9" fill="#4A4038">${g}%</text>`;
  });
  let dots = values.map((v,i)=>`<circle cx="${xFor(i)}" cy="${yFor(v)}" r="2.5" fill="#A48B76"/>`).join('');
  let labels = values.map((v,i)=> (i%2===0 || n<20) ? `<text x="${xFor(i)}" y="${h-6}" font-size="8" fill="#4A4038" text-anchor="middle">${i+1}</text>` : '').join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
    ${grid}
    <polyline points="${pts}" fill="none" stroke="#A48B76" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}

function areaChartSvg(values){
  const w=1000, h=220, padL=36, padR=10, padT=14, padB=24;
  const n = values.length;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const stepX = n>1 ? innerW/(n-1) : innerW;
  const yFor = v => padT + innerH - (v/100)*innerH;
  const xFor = i => padL + i*stepX;
  let linePts = values.map((v,i)=>`${xFor(i)},${yFor(v)}`).join(' ');
  const areaPts = `${padL},${padT+innerH} ` + linePts + ` ${xFor(n-1)},${padT+innerH}`;
  let grid = '';
  [0,25,50,75,100].forEach(g=>{
    const gy = yFor(g);
    grid += `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#E4DFD5" stroke-width="1"/>
    <text x="4" y="${gy+3}" font-size="9" fill="#4A4038">${g}%</text>`;
  });
  let labels = values.map((v,i)=> (i%2===0 || n<20) ? `<text x="${xFor(i)}" y="${h-6}" font-size="8" fill="#4A4038" text-anchor="middle">${i+1}</text>` : '').join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
    ${grid}
    <polygon points="${areaPts}" fill="#C9C7F2" opacity="0.6"/>
    <polyline points="${linePts}" fill="none" stroke="#8886c9" stroke-width="2"/>
    ${labels}
  </svg>`;
}
